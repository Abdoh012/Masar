<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reCAPTCHA v2 Test</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
      body { font-family: Arial, sans-serif; margin: 40px; }
      code { background: #f4f4f4; padding: 4px; border-radius: 4px; }
      .box { margin-top: 20px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h2>reCAPTCHA v2</h2>
    <p>Open this page from <strong>http://localhost/recaptcha.html</strong> or <strong>http://localhost/masar-backend/recaptcha.html</strong>.</p>
    <div class="g-recaptcha" data-sitekey="6Ldc5X0tAAAAAM72tH-r4dM4oH11B1Jlxq8_Qvd5"></div>
    <br />
    <button onclick="showToken()">Get Token</button>
    <div class="box">
      <p><strong>Token:</strong></p>
      <textarea id="tokenOutput" rows="6" cols="80"></textarea>
    </div>

    <script>
      function showToken() {
        const token = grecaptcha.getResponse();
        document.getElementById("tokenOutput").value = token;
      }
    </script>
  </body>
</html>
