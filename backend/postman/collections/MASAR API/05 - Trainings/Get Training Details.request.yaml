$kind: http-request
description: "Full training detail: company, skills, specializations, application questions, and (with a student token) is_saved, has_applied and the student's application summary."
url: "{{base_url}}/api/v1/trainings/details/{{training_id}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
order: 4000
