$kind: http-request
description: "Public list of published trainings with filters (specialization_id, skill_id, training_type, work_mode, paid, employment_possible, company_id, city, keyword). Training keyword search lives in the dedicated Search API: GET /api/v1/search/trainings?q=... Training specializations come exclusively from training_specializations (inherited from the company's company_specializations); there is no training field filter, sort (newest/oldest/title/name/deadline/relevance) and pagination. Works without a token; a student token adds per-item is_saved. AUTHENTICATED STUDENTS: results are automatically restricted to published trainings owned by companies whose registered specialization (company_specializations) matches the student's own students.specialization_id. The student does not send any parameter for this and query parameters cannot override it; a student without a specialization receives an empty list (total=0). All other filters, sorting and pagination still apply on top of this restriction."
url: "{{base_url}}/api/v1/trainings/list?page=1&limit=20&sort=newest"
method: GET
headers:
  Accept: application/json
queryParams:
  page: "1"
  limit: "20"
  sort: newest
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('listing returns items', function () { pm.expect(json.data.items).to.be.an('array'); });
      pm.test('training card contains all expected fields', function () {
          json.data.items.forEach(function (item) {
              pm.expect(item).to.have.property('id');
              pm.expect(item).to.have.property('company_id');
              pm.expect(item).to.have.property('title');
              pm.expect(item).to.have.property('description');
              pm.expect(item).to.have.property('training_type');
              pm.expect(item).to.have.property('mode');
              pm.expect(item).to.have.property('may_lead_to_employment');
              pm.expect(item).to.have.property('is_paid');
              pm.expect(item).to.have.property('compensation_amount');
              pm.expect(item).to.have.property('compensation_currency');
              pm.expect(item).to.have.property('capacity');
              pm.expect(item).to.have.property('status');
              pm.expect(item).to.have.property('starts_at');
              pm.expect(item).to.have.property('ends_at');
              pm.expect(item).to.have.property('application_deadline');
              pm.expect(item).to.have.property('location');
              pm.expect(item).to.have.property('created_at');
              pm.expect(item).to.have.property('updated_at');
              pm.expect(item).to.have.property('company_name');
              pm.expect(item).to.have.property('company_city');
              pm.expect(item).to.have.property('company_logo');
              pm.expect(item).to.have.property('is_saved');
              pm.expect(item).to.have.property('duration');
              pm.expect(item.skills).to.be.an('array');
              pm.expect(item.specializations).to.be.an('array');
          });
      });
      pm.test('duration is a non-negative integer or null', function () {
          json.data.items.forEach(function (item) {
              const d = item.duration;
              if (d !== null) {
                  pm.expect(d).to.be.a('number');
                  pm.expect(d).to.be.at.least(0);
              }
          });
      });
    language: text/javascript
order: 1000
