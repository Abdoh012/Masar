description: "Student training discovery and saved trainings: list with filters/sort, detail (enriched, optional student context), save, unsave and saved list. Read endpoints work for guests; save/unsave/saved require a student token (set the training_id collection variable first). Company lifecycle: Extend Training (PUT/PATCH /api/v1/trainings/update?id=...) extends the owner's own published training by updating end_date (countdown goes from 0 to a live value on the expired fixture {{extend_training_id}}); Delete Training (DELETE /api/v1/trainings/delete?id=...) removes the owner's own DRAFT only ({{delete_training_id}}, seeded by database/seeders/backend_spec199_test_data_seeder.php). Both require {{company_token}} set by Login (Company)."
order: 7000