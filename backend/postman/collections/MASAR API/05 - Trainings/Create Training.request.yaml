$kind: http-request
description: "Creates a training opportunity for the authenticated company. The frontend does NOT send specialization ids: the backend automatically inherits ALL of the company's current specializations (company_specializations) into training_specializations inside one transaction; if inheritance fails, creation is rolled back. Set {{company_id}} to the authenticated company's id."
url: "{{base_url}}/api/v1/trainings/create"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "company_id": {{company_id}},
      "title": "Backend Internship [PostmanTest]",
      "description": "Created to verify automatic specialization inheritance from company_specializations.",
      "training_type": "hands_on",
      "work_mode": "remote",
      "paid": 1,
      "salary": 3000
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('training created successfully', function () { pm.expect(json.success).to.eql(true); });
      pm.test('specializations inherited from company', function () {
          pm.expect(json.data.specializations).to.be.an('array');
          pm.expect(json.data.specializations.length).to.be.above(0);
          pm.expect(json.data.specializations[0]).to.have.property('id');
          pm.expect(json.data.specializations[0]).to.have.property('name');
      });
      if (json.success && json.data && json.data.id) { pm.collectionVariables.set('training_id', json.data.id); }
    language: text/javascript
order: 2000
