$kind: http-request
description: Public. Generates a Google authorization URL. The backend creates a single-use server-side state (expires in 600s) and embeds it in the URL. The test stores the returned URL and extracts `state` into `google_state`. Open the URL in a real browser to obtain the authorization `code`.
url: "{{base_url}}/api/v1/auth/google"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Google authorization URL generated", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.authorization_url).to.be.a('string');
      });
      if (pm.response.code === 200) {
          const json = pm.response.json();
          const match = (json.data.authorization_url || '').match(/[?&]state=([^&]+)/);
          if (match) {
              pm.collectionVariables.set('google_state', decodeURIComponent(match[1]));
          }
      }
    language: text/javascript
order: 1000
