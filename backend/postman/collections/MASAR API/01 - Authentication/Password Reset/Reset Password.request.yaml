$kind: http-request
description: Public. Resets the password using the verified OTP. The account password becomes `{{new_password}}` and all tokens are revoked.
url: "{{base_url}}/api/v1/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{student_email}}",
        "token": "{{reset_token}}",
        "password": "{{new_password}}",
        "password_confirmation": "{{new_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Password reset succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 4000
