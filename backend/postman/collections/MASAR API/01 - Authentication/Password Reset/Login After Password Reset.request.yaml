$kind: http-request
description: Public. Verifies that the account can log in with the new password after a password reset. On success `student_password` is updated to the new password so subsequent requests stay consistent.
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{student_email}}",
        "password": "{{new_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login with new password succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set('access_token', json.data.token);
          pm.collectionVariables.set('user_id', String(json.data.user.id));
          pm.collectionVariables.set('user_role', json.data.user.role);
          pm.collectionVariables.set('student_password', pm.collectionVariables.get('new_password'));
      }
    language: text/javascript
order: 5000
