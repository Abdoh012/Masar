$kind: http-request
description: Requires Bearer token. Revokes the current session tokens and clears the refresh cookie. The test saves the used access token into `revoked_token` so the security tests can verify a revoked token is rejected.
url: "{{base_url}}/api/v1/auth/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Logout succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
      const current = pm.collectionVariables.get('access_token');
      if (current) {
          pm.collectionVariables.set('revoked_token', current);
      }
      pm.collectionVariables.set('access_token', '');
    language: text/javascript
order: 7000
