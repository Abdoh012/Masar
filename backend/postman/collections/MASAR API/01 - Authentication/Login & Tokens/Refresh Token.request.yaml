$kind: http-request
description: Requires the HttpOnly `refresh_token` cookie and a matching `X-CSRF-Token` header (attached automatically by the pre-request script). Run after Login. On 200 the server returns a new access token and rotates the refresh/CSRF cookies.
url: "{{base_url}}/api/v1/auth/refresh"
method: POST
scripts:
  - type: beforeRequest
    code: |-
      let csrf = pm.cookies.get('csrf_token');
      if (!csrf) {
          csrf = pm.collectionVariables.get('csrf_token');
      }
      if (csrf) {
          pm.request.headers.upsert({ key: 'X-CSRF-Token', value: csrf });
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Refresh succeeds and returns a new access token", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.have.property('token');
      });
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set('access_token', json.data.token);
          const csrf = pm.cookies.get('csrf_token');
          if (csrf) {
              pm.collectionVariables.set('csrf_token', csrf);
          }
          pm.response.headers.each(function (header) {
              if (header.key.toLowerCase() === 'set-cookie') {
                  const match = header.value.match(/refresh_token=([^;]+)/);
                  if (match) {
                      pm.collectionVariables.set('refresh_token', decodeURIComponent(match[1]));
                  }
              }
          });
      }
    language: text/javascript
order: 5000
