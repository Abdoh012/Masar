$kind: http-request
description: Requires Bearer token. Changes the authenticated user's password. On success all tokens are revoked and cookies cleared, so re-login is required afterwards.
url: "{{base_url}}/api/v1/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "current_password": "{{student_password}}",
        "new_password": "{{new_password}}",
        "new_password_confirmation": "{{new_password}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Password change succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 6000
