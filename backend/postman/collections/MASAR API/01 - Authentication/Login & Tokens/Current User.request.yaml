$kind: http-request
description: Requires Bearer token. Returns the currently authenticated user from the token identity.
url: "{{base_url}}/api/v1/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Current user returned", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.have.property('email');
      });
    language: text/javascript
order: 4000
