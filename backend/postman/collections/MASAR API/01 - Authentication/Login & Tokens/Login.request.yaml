$kind: http-request
description: Public. Authenticates a user. On 200 the response returns `data.token` (access token) and the server sets an HttpOnly `refresh_token` cookie plus a readable `csrf_token` cookie. The test stores all of these in collection variables. Set `{{student_email}}`/`{{student_password}}` to an account that exists in your environment.
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{student_email}}",
        "password": "{{student_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.have.property('token');
          pm.expect(json.data).to.have.property('user');
      });
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set('access_token', json.data.token);
          pm.collectionVariables.set('user_id', String(json.data.user.id));
          pm.collectionVariables.set('user_role', json.data.user.role);
          const csrf = pm.cookies.get('csrf_token');
          if (csrf) {
              pm.collectionVariables.set('csrf_token', csrf);
          }
          pm.response.headers.each(function (header) {
              if (header.key.toLowerCase() === 'set-cookie') {
                  const match = header.value.match(/refresh_token=([^;]+)/);
                  if (match) {
                      pm.collectionVariables.set('refresh_token', decodeURIComponent(match[1]));
                  }
              }
          });
      }
    language: text/javascript
order: 1000
