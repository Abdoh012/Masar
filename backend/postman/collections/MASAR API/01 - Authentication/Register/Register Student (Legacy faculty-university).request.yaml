$kind: http-request
name: Register Student (Legacy faculty/university)
description: "LEGACY COMPATIBILITY ONLY. Uses the old `faculty` key (accepted as a fallback for `field`) plus `specialization`. `university` is ignored and is NOT part of the current mapping (`study_fields` -> `students.field_id`, `specializations` -> `students.specialization_id`). The NEW primary registration flow uses `field`. Expected: 201 (or 409 if the email already exists)."
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "full_name": "Legacy Student",
        "email": "{{legacy_student_email}}",
        "password": "{{legacy_student_password}}",
        "password_confirmation": "{{legacy_student_password}}",
        "accept_terms": true,
        "role": "student",
        "faculty": "Engineering",
        "specialization": "Mechanical Engineering",
        "university": "Alexandria University"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Legacy student registration succeeds or already exists", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 409]);
      });
      if (pm.response.code === 201) {
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.user.role).to.eql('student');
          pm.expect(json.data.user.status).to.eql('active');
      }
    language: text/javascript
order: 2000
