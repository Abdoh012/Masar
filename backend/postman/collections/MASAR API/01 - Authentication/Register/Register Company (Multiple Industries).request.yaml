$kind: http-request
description: "Company registration with MULTIPLE industries. Every industry name must exist as an active specialization (shared with students); all are stored in company_specializations. Expected: 201 (or 409 if the email already exists)."
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "company.multi@test.local",
        "password": "{{register_company_password}}",
        "password_confirmation": "{{register_company_password}}",
        "accept_terms": true,
        "role": "company",
        "company_name": "TechNova Labs Dev",
        "industry": [
            "Software Engineering",
            "Artificial Intelligence",
            "Data Science"
        ],
        "description": "Company registering with multiple industries."
     }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Multi-industry company registration responds", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 409]);
      });
    language: text/javascript
order: 4000
