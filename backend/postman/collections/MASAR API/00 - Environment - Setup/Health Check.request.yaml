$kind: http-request
description: Public. Verifies the API is reachable and healthy. No authentication required.
url: "{{base_url}}/api/v1/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Health check returns ok", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.status).to.eql('ok');
      });
    language: text/javascript
order: 1000
