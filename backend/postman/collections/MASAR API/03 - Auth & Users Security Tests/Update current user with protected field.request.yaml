$kind: http-request
description: Security test. Attempts to escalate role through the update body. The backend rejects protected fields with 422. Requires login first (for the CSRF header).
url: "{{base_url}}/api/v1/users/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "role": "admin"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      let csrf = pm.cookies.get('csrf_token');
      if (!csrf) {
          csrf = pm.collectionVariables.get('csrf_token');
      }
      if (csrf) {
          pm.request.headers.upsert({ key: 'X-CSRF-Token', value: csrf });
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Protected field update rejected with 422", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
          pm.expect(json.errors).to.have.property('role');
      });
    language: text/javascript
order: 16000
