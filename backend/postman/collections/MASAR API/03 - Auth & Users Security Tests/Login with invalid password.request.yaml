$kind: http-request
description: Security test. Verifies invalid credentials are rejected with 401 (generic error, no account-enumeration detail).
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{student_email}}",
        "password": "WrongPass@2026!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Invalid password rejected", function () {
          pm.expect(pm.response.code).to.eql(401);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 1000
