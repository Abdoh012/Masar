$kind: http-request
description: Security test. Sends a valid refresh cookie (from the jar) but a mismatched `X-CSRF-Token` header. Run after Login. Verifies the mismatch is rejected with 403.
url: "{{base_url}}/api/v1/auth/refresh"
method: POST
headers:
  X-CSRF-Token: wrong-csrf-value
scripts:
  - type: afterResponse
    code: |-
      pm.test("Refresh with CSRF mismatch rejected", function () {
          pm.expect(pm.response.code).to.be.oneOf([401, 403]);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 15000
