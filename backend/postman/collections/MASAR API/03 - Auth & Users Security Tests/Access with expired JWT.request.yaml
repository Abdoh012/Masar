$kind: http-request
description: Security test. Sends a JWT whose `exp` claim is in the past. Verifies expired tokens are rejected with 401.
url: "{{base_url}}/api/v1/auth/me"
method: GET
headers:
  Authorization: Bearer {{expired_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expired JWT rejected", function () {
          pm.expect(pm.response.code).to.eql(401);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 7000
