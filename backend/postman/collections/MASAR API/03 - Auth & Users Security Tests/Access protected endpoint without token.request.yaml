$kind: http-request
description: Security test. Verifies that a protected endpoint with no access token returns 401.
url: "{{base_url}}/api/v1/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Missing authentication rejected", function () {
          pm.expect(pm.response.code).to.eql(401);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 4000
