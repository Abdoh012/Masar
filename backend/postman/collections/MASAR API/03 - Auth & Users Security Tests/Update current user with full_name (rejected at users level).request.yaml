$kind: http-request
description: Security test. At the Users level only `email` is directly editable on the shared `users` table. `full_name` belongs to the role-specific profile (students.full_name / companies.legal_name) and must be rejected with 422.
url: "{{base_url}}/api/v1/users/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "full_name": "Hacker Name"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      let csrf = pm.cookies.get('csrf_token');
      if (!csrf) {
          csrf = pm.collectionVariables.get('csrf_token');
      }
      if (csrf) {
          pm.request.headers.upsert({ key: 'X-CSRF-Token', value: csrf });
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("full_name is not editable at the users level", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
          pm.expect(json.errors).to.have.property('full_name');
      });
    language: text/javascript
order: 26000
