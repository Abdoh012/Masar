$kind: http-request
description: Security test. Run after a successful Register Student. Verifies re-registering the same email is rejected with 409.
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{register_student_email}}",
        "password": "{{register_student_password}}",
        "password_confirmation": "{{register_student_password}}",
        "accept_terms": true,
        "role": "student",
        "full_name": "Test Student",
        "field": "Engineering",
        "specialization": "Mechanical Engineering"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Duplicate registration rejected with 409", function () {
          pm.expect(pm.response.code).to.eql(409);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 3000
