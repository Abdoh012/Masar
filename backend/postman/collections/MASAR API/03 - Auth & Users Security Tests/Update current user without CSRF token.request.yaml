$kind: http-request
description: Security test. Sends no `X-CSRF-Token` header. Run after Login (so the CSRF cookie exists). Verifies the write is rejected with 403 (or 401 if not logged in).
url: "{{base_url}}/api/v1/users/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{updated_email}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Missing CSRF token rejected", function () {
          pm.expect(pm.response.code).to.be.oneOf([401, 403]);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 12000
