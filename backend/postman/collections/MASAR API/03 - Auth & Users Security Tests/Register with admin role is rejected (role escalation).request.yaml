$kind: http-request
description: "Security test. The server/database decides the role; a client-provided `role: admin` in the register body must be rejected with 422 (only `student` and `company` are registrable roles). No successful public Admin registration exists."
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "esc.role@test.local",
        "password": "EscapeRole@12345",
        "password_confirmation": "EscapeRole@12345",
        "accept_terms": true,
        "role": "admin",
        "full_name": "Role Escalation Attempt",
        "field": "Engineering",
        "specialization": "Mechanical Engineering"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Admin role in the register body is rejected", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
          pm.expect(json.errors).to.have.property('role');
      });
      pm.test("Server controls the role, never the request body", function () {
          const json = pm.response.json();
          if (json.data && json.data.user) {
              pm.expect(json.data.user.role).to.not.eql('admin');
          }
      });
    language: text/javascript
order: 23000
