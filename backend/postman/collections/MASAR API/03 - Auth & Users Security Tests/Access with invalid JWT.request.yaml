$kind: http-request
description: Security test. Sends a well-formed 3-segment JWT with a bogus signature. Verifies signature validation rejects it with 401.
url: "{{base_url}}/api/v1/auth/me"
method: GET
headers:
  Authorization: Bearer {{invalid_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Invalid JWT rejected", function () {
          pm.expect(pm.response.code).to.eql(401);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 6000
