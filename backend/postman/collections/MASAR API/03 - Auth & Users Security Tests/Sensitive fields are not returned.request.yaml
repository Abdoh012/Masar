$kind: http-request
description: Security test. Verifies the response never exposes `password_hash`, `remember_token`, `verification_token` or a plaintext `password`.
url: "{{base_url}}/api/v1/users/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Sensitive fields are not returned", function () {
          pm.expect(pm.response.code).to.eql(200);
          const raw = JSON.stringify(pm.response.json());
          pm.expect(raw).to.not.include('password_hash');
          pm.expect(raw).to.not.include('remember_token');
          pm.expect(raw).to.not.include('verification_token');
          pm.expect(raw).to.not.include('"password"');
          pm.expect(raw).to.not.include('refresh_token');
          pm.expect(raw).to.not.include('access_token');
          pm.expect(raw).to.not.include('csrf_token');
          pm.expect(raw).to.not.include('otp');
          pm.expect(raw).to.not.include('reset_token');
          pm.expect(raw).to.not.include('secret');
      });
    language: text/javascript
order: 19000
