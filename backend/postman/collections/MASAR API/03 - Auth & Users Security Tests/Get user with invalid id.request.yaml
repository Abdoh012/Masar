$kind: http-request
description: Security test. Verifies a non-positive user ID is rejected with 422.
url: "{{base_url}}/api/v1/users/0"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Invalid user id rejected with 422", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 21000
