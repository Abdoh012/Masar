$kind: http-request
description: Security test. Verifies a non-existent user ID returns 404.
url: "{{base_url}}/api/v1/users/99999999"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Non-existent user returns 404", function () {
          pm.expect(pm.response.code).to.eql(404);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 22000
