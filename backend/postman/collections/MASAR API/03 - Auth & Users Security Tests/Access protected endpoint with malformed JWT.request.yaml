$kind: http-request
description: Security test. Sends a malformed Bearer token (not 3 segments). Verifies 401.
url: "{{base_url}}/api/v1/auth/me"
method: GET
headers:
  Authorization: "{{bearer_token_18vm}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Malformed JWT rejected", function () {
          pm.expect(pm.response.code).to.eql(401);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 5000
