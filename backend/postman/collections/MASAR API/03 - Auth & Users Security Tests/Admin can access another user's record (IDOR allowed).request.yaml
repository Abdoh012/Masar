$kind: http-request
description: "Security test (IDOR). The pre-request logs in as the admin account so this test is deterministic. Admins may view any user record. Expected: 200."
url: "{{base_url}}/api/v1/users/{{other_user_id}}"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      const loginReq = {
          url: pm.collectionVariables.get('base_url') + '/api/v1/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: { mode: 'raw', raw: JSON.stringify({
              email: pm.collectionVariables.get('admin_email'),
              password: pm.collectionVariables.get('admin_password')
          }) }
      };
      pm.sendRequest(loginReq, function (err, res) {
          if (!err && res.code === 200 && res.json().data && res.json().data.token) {
              pm.collectionVariables.set('admin_token', res.json().data.token);
              pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + res.json().data.token });
          }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Admin can access another user's record", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.have.property('id');
      });
    language: text/javascript
order: 27000
