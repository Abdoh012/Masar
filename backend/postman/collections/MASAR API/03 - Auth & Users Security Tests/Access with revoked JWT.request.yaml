$kind: http-request
description: Security test. Run after Logout (which stores the used token in `revoked_token`). Verifies a server-side revoked access token is rejected with 401.
url: "{{base_url}}/api/v1/auth/me"
method: GET
headers:
  Authorization: Bearer {{revoked_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Revoked JWT rejected", function () {
          pm.expect(pm.response.code).to.eql(401);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 8000
