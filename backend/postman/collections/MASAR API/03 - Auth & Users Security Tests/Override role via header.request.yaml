$kind: http-request
description: Security test. Attempts to escalate role via an `X-User-Role` header. The role comes from the JWT, so the header is ignored.
url: "{{base_url}}/api/v1/auth/me"
method: GET
headers:
  X-User-Role: admin
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Role override via header is ignored", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          const expectedRole = pm.collectionVariables.get('user_role');
          if (expectedRole) {
              pm.expect(json.data.role).to.eql(expectedRole);
          }
      });
    language: text/javascript
order: 11000
