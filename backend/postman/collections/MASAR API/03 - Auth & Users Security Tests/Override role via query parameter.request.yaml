$kind: http-request
description: Security test. Attempts to escalate role via a `role` query parameter. The role comes from the JWT, so the parameter is ignored.
url: "{{base_url}}/api/v1/auth/me?role=admin"
method: GET
queryParams:
  role: admin
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Role override via query is ignored", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          const expectedRole = pm.collectionVariables.get('user_role');
          if (expectedRole) {
              pm.expect(json.data.role).to.eql(expectedRole);
          }
      });
    language: text/javascript
order: 10000
