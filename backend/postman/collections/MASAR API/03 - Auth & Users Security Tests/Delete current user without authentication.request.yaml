$kind: http-request
description: Security test. DELETE /users/me without a Bearer token must return 401.
url: "{{base_url}}/api/v1/users/me"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Delete without authentication returns 401", function () {
          pm.expect(pm.response.code).to.eql(401);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 24000
