$kind: http-request
description: Security test. Overrides the refresh cookie with an invalid JWT refresh token and sends a valid CSRF header. Run after Login. Verifies the invalid refresh token is rejected with 401.
url: "{{base_url}}/api/v1/auth/refresh"
method: POST
scripts:
  - type: beforeRequest
    code: |-
      pm.cookies.set('refresh_token', pm.collectionVariables.get('invalid_refresh_token'));
      let csrf = pm.cookies.get('csrf_token');
      if (!csrf) {
          csrf = pm.collectionVariables.get('csrf_token');
      }
      if (csrf) {
          pm.request.headers.upsert({ key: 'X-CSRF-Token', value: csrf });
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Invalid refresh cookie rejected", function () {
          pm.expect(pm.response.code).to.eql(401);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 14000
