$kind: http-request
description: Security test. Sends invalid email data to the update endpoint. Verifies validation rejects it with 422. Requires login first (for the CSRF header).
url: "{{base_url}}/api/v1/users/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "not-an-email"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      let csrf = pm.cookies.get('csrf_token');
      if (!csrf) {
          csrf = pm.collectionVariables.get('csrf_token');
      }
      if (csrf) {
          pm.request.headers.upsert({ key: 'X-CSRF-Token', value: csrf });
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Invalid email update rejected with 422", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 17000
