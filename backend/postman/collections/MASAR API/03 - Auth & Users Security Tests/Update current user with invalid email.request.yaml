$kind: http-request
description: Security test. Sends invalid email data to the update endpoint. Verifies validation rejects it with 422. Requires login first (for the CSRF header).
url: "{{base_url}}/api/v1/users/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "not-an-email"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
order: 17000
