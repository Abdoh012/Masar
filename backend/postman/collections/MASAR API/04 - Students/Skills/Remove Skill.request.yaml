$kind: http-request
description: Requires a student Bearer token. Removes a single skill by name from the body. Returns 200 with the updated skills list, or 404 if the skill is not present.
url: "{{base_url}}/api/v1/students/me/skills"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "skill": "React"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Remove skill responds", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });
    language: text/javascript
order: 4000
