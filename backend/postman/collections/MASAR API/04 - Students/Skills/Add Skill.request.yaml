$kind: http-request
description: Requires a student Bearer token. Adds a single skill by name. Returns 201 with the updated skills list, or 409 if the skill already exists.
url: "{{base_url}}/api/v1/students/me/skills"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "skill": "React"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Add skill responds", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 409]);
      });
    language: text/javascript
order: 2000
