$kind: http-request
description: Requires a student Bearer token. Replaces the student's entire skills list (up to 50 skills, no duplicates).
url: "{{base_url}}/api/v1/students/me/skills"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "skills": [
            "PHP",
            "Laravel",
            "MySQL",
            "React"
        ]
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Replace skills succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 3000
