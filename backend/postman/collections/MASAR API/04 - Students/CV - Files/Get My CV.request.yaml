$kind: http-request
description: Requires a student Bearer token. Returns the student's current `cv_file_id` (null if no CV attached). Captures `cv_file_id`.
url: "{{base_url}}/api/v1/students/me/cv"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("My CV returned", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
      const json = pm.response.json();
      if (json.data && json.data.cv_file_id) {
          pm.collectionVariables.set('cv_file_id', String(json.data.cv_file_id));
      }
    language: text/javascript
order: 3000
