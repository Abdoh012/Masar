$kind: http-request
description: Requires a Bearer token. Streams the file owned by the authenticated user as an attachment when `download=true` is passed; without it the endpoint returns file metadata.
url: "{{base_url}}/api/v1/files/{{file_id}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("File download responded", function () {
          pm.expect(pm.response.code).to.eql(200);
      });
    language: text/javascript
order: 5000
