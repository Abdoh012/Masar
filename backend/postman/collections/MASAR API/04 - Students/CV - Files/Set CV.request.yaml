$kind: http-request
description: Requires a student Bearer token. Attaches a file (owned by the authenticated user) as the student's CV by `file_id`. The value uses the uploaded CV id held in the collection variable `cv_file_id`. Returns 422 if the file does not belong to the user.
url: "{{base_url}}/api/v1/students/me/cv"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "file_id": "{{cv_file_id}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Set CV succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
      const json = pm.response.json();
      if (json.data && json.data.cv_file_id) {
          pm.collectionVariables.set('cv_file_id', String(json.data.cv_file_id));
      }
    language: text/javascript
order: 4000
