$kind: http-request
description: "Requires a student Bearer token. Completes the profile in one request and sets `is_profile_complete = 1`. `full_name`, `field`, `specialization`, `skills` and `cv_file_id` are required (name-based `field`/`specialization`; University is NOT required). The `cv_file_id` must belong to the authenticated user. Expected: 200."
url: "{{base_url}}/api/v1/students/profile/complete"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "full_name": "Test Student",
        "field": "Engineering",
        "specialization": "Artificial Intelligence",
        "degree": "Bachelor of Engineering",
        "bio": "Complete profile with CV and skills.",
        "skills": [
            "PHP",
            "Laravel",
            "MySQL",
            "React"
        ],
        "cv_file_id": "{{cv_file_id}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Complete student profile succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 5000
