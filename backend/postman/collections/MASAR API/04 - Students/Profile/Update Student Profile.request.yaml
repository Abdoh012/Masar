$kind: http-request
description: "Requires a student Bearer token. Updates the profile. When `field`/`specialization` are present they must be provided together and are resolved by name against `study_fields`/`specializations`. University is NOT part of the current model and is ignored if sent. Expected: 200."
url: "{{base_url}}/api/v1/students/profile"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "field": "Computer Science",
        "specialization": "Data Science",
        "degree": "Bachelor of Computer Science",
        "bio": "Updated bio: interested in data science and backend development.",
        "phone": "01012345678",
        "city": "Cairo",
        "graduation_year": 2028
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Update student profile succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 3000
