$kind: http-request
description: "Student registration validation. The password must satisfy the backend password-strength rules. Expected: 422 with an error on `password`."
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "full_name": "Validation Student",
        "email": "val.weakpass@test.local",
        "password": "weak",
        "password_confirmation": "weak",
        "accept_terms": true,
        "role": "student",
        "field": "Engineering",
        "specialization": "Mechanical Engineering"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Weak password is rejected with 422", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
          pm.expect(json.errors).to.have.property('password');
      });
    language: text/javascript
order: 5000
