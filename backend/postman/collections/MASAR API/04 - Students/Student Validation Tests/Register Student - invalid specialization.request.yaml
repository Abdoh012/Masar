$kind: http-request
description: Student registration validation. `Software Development` does not exist in `specializations`, so the registration must fail with 422.
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "full_name": "Validation Student",
        "email": "val.badspec@test.local",
        "password": "Student@12345",
        "password_confirmation": "Student@12345",
        "accept_terms": true,
        "role": "student",
        "field": "Engineering",
        "specialization": "Software Development"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Invalid specialization (not in specializations) is rejected", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 4000
