$kind: http-request
description: "Student registration validation. `accept_terms` must be truthy. Expected: 422 with an error on `accept_terms`."
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "full_name": "Validation Student",
        "email": "val.noterms@test.local",
        "password": "Student@12345",
        "password_confirmation": "Student@12345",
        "accept_terms": false,
        "role": "student",
        "field": "Engineering",
        "specialization": "Mechanical Engineering"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Terms not accepted is rejected with 422", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
          pm.expect(json.errors).to.have.property('accept_terms');
      });
    language: text/javascript
order: 7000
