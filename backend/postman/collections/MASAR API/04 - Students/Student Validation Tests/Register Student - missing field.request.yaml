$kind: http-request
description: "Student registration validation. `field` is required (resolved against `study_fields`). Expected: 422 with an error on `field`."
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "full_name": "Validation Student",
        "email": "val.nofield@test.local",
        "password": "Student@12345",
        "password_confirmation": "Student@12345",
        "accept_terms": true,
        "role": "student",
        "specialization": "Mechanical Engineering"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Missing field is rejected with 422", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(false);
          pm.expect(json.errors).to.have.property('field');
      });
    language: text/javascript
order: 1000
