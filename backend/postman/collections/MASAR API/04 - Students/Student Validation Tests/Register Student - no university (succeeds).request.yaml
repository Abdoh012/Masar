$kind: http-request
description: "Positive validation. The current student model does NOT require university: `field` -> `study_fields` -> `students.field_id`, `specialization` -> `specializations` -> `students.specialization_id`. Expected: 201."
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "full_name": "No University Student",
        "email": "{{no_university_email}}",
        "password": "Student@12345",
        "password_confirmation": "Student@12345",
        "accept_terms": true,
        "role": "student",
        "field": "Engineering",
        "specialization": "Mechanical Engineering"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Student registration succeeds without university", function () {
          pm.expect(pm.response.code).to.eql(201);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.user.role).to.eql('student');
          pm.expect(json.data.user.status).to.eql('active');
          pm.expect(json.data).to.have.property('token');
      });
      pm.test("Response does not include university data", function () {
          const raw = JSON.stringify(pm.response.json());
          pm.expect(raw).to.not.include('university');
      });
    language: text/javascript
order: 9000
