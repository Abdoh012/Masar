$kind: http-request
description: Requires a student Bearer token. Returns the student's applications (paginated `data.items` + `data.pagination`). Captures `application_id` from the first item.
url: "{{base_url}}/api/v1/applications/my"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("My applications listed", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
      const json = pm.response.json();
      if (json.data && json.data.items && json.data.items.length && json.data.items[0].id) {
          pm.collectionVariables.set('application_id', String(json.data.items[0].id));
      }
    language: text/javascript
order: 2000
