$kind: http-request
description: Student applies for a training opportunity. `training_id` must reference an existing open/published training (set the `training_id` collection variable). Captures `application_id` from the response.
url: "{{base_url}}/api/v1/applications"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: full_name
      value: Ahmed Mohamed
    - type: text
      key: email
      value: ahmed@example.com
    - type: text
      key: phone
      value: "01000000000"
    - type: text
      key: address
      value: Alexandria
    - type: text
      key: city
      value: Alexandria
    - type: text
      key: training_id
      value: "{{training_id}}"
    - type: text
      key: university_id
      value: "2"
    - type: text
      key: academic_year
      value: 3rd year
    - type: text
      key: applicant_type
      value: student
    - type: text
      key: message
      value: I am interested in this training.
    - type: text
      key: why_interested
      value: I want to join this training and improve my practical skills.
    - type: text
      key: what_to_learn
      value: I want to improve my PHP and SQL skills.
    - type: text
      key: skills[]
      value: PHP
    - type: text
      key: skills[]
      value: SQL
    - type: file
      key: cv
      src:
        - ""
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Create application succeeds", function () {
          pm.expect(pm.response.code).to.eql(201);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
      const json = pm.response.json();
      if (json.data && json.data.id) {
          pm.collectionVariables.set('application_id', String(json.data.id));
      }
    language: text/javascript
order: 1000
