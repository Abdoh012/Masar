$kind: http-request
description: Requires a student Bearer token. Returns a single application with training/company details. Students can only view their own applications (403 otherwise).
url: "{{base_url}}/api/v1/applications/{{application_id}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Application returned", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
      pm.test("Application exposes university as text", function () {
          const json = pm.response.json();
          if (json.data) {
              pm.expect(json.data).to.not.have.property('university_id');
              if (json.data.university != null) {
                  pm.expect(json.data.university).to.be.a('string');
              }
          }
      });
    language: text/javascript
order: 3000
