$kind: http-request
description: Requires a Bearer token. Marks all of the authenticated user's notifications as read.
url: "{{base_url}}/api/v1/notifications/read-all"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("All notifications marked as read", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 4000
