$kind: http-request
description: Requires a Bearer token. Returns the number of unread notifications for the authenticated user.
url: "{{base_url}}/api/v1/notifications/unread-count"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Unread count returned", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.have.property('count');
      });
    language: text/javascript
order: 5000
