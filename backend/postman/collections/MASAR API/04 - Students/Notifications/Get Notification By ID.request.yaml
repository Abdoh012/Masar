$kind: http-request
description: Requires a Bearer token. Returns a single notification belonging to the authenticated user (404 if not found or owned by another user).
url: "{{base_url}}/api/v1/notifications/{{notification_id}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Notification returned", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 2000
