$kind: http-request
description: Public. Lists the active specializations that BELONG to one study field (run Get Study Fields first so {{field_id}} is set). Student registration must pick its Specialization from this list; the backend rejects mismatched field/specialization combinations.
url: "{{base_url}}/api/v1/lookups/study-fields/{{field_id}}/specializations"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Field specializations returned", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.study_field).to.be.an('object');
          pm.expect(Array.isArray(json.data.specializations)).to.eql(true);
      }
    language: text/javascript
order: 2000
