$kind: http-request
description: Public. Lists ALL active specializations together with their study field. Single source of truth shared by the student Specialization list and the company Industry list (company_specializations).
url: "{{base_url}}/api/v1/lookups/specializations"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("All specializations returned", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(Array.isArray(json.data.specializations)).to.eql(true);
          pm.expect(json.data.specializations.length).to.be.above(0);
      }
    language: text/javascript
order: 3000
