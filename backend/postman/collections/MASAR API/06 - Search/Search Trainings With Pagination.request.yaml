$kind: http-request
description: Search pagination. Page 2 preserves the same q; total stays identical across pages while items differ. limit max 100.
url: "{{base_url}}/api/v1/search/trainings?q=Training&page=2&limit=10"
method: GET
headers:
  Accept: application/json
queryParams:
  q: Training
  page: "2"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('search returns 200', function () { pm.response.to.have.status(200); });
      pm.test('success is true', function () { pm.expect(json.success).to.eql(true); });
      pm.test('items is an array', function () { pm.expect(json.data.items).to.be.an('array'); });
      pm.test('pagination metadata present', function () {
          pm.expect(json.data.total).to.be.a('number');
          pm.expect(json.data.page).to.be.a('number');
          pm.expect(json.data.limit).to.be.a('number');
          pm.expect(json.data.query).to.be.a('string');
      });
      pm.test('page 2 requested and respected', function () { pm.expect(json.data.page).to.eql(2); });
      pm.test('limit respected', function () { pm.expect(json.data.limit).to.eql(10); });
      pm.test('at most 10 items returned', function () { pm.expect(json.data.items.length).to.be.at.most(10); });
    language: text/javascript
order: 9000
