$kind: http-request
description: A keyword that matches nothing must return the normal success envelope with an empty items array and total 0 (not an error).
url: "{{base_url}}/api/v1/search/trainings?q=zzxq99nope"
method: GET
headers:
  Accept: application/json
queryParams:
  q: zzxq99nope
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('no-result search returns 200', function () { pm.response.to.have.status(200); });
      pm.test('success is true', function () { pm.expect(json.success).to.eql(true); });
      pm.test('items array is empty', function () { pm.expect(json.data.items).to.be.an('array').and.to.have.lengthOf(0); });
      pm.test('total is 0', function () { pm.expect(json.data.total).to.eql(0); });
    language: text/javascript
order: 7000
