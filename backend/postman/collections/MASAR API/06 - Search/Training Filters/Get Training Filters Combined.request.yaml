$kind: http-request
description: All filters combined with AND semantics plus sorting and pagination.
url: "{{base_url}}/api/v1/search/trainings/filters"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: null
    value: null
  - key: null
    value: null
  - key: null
    value: null
  - key: null
    value: null
  - key: null
    value: null
  - key: null
    value: null
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('returns 200', function () { pm.response.to.have.status(200); });
      pm.test('success is true', function () { pm.expect(json.success).to.eql(true); });
      pm.test('items is an array', function () { pm.expect(json.data.items).to.be.an('array'); });
      pm.test('pagination metadata present', function () {
          pm.expect(json.data.total).to.be.a('number');
          pm.expect(json.data.page).to.be.a('number');
          pm.expect(json.data.limit).to.be.a('number');
      });
      const json = pm.response.json();
      pm.test('every item satisfies all filters', function () {
          json.data.items.forEach(function (item) {
              pm.expect(item.training_type).to.eql('hands_on');
              pm.expect(item.mode).to.eql('hybrid');
              pm.expect(Number(item.is_paid)).to.eql(1);
          });
      });
    language: text/javascript
order: 12000
