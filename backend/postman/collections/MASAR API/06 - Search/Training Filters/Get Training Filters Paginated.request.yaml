$kind: http-request
description: "Standard pagination: page/limit (max 100). Totals stay identical across pages while items differ."
url: "{{base_url}}/api/v1/search/trainings/filters"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: null
    value: null
  - key: null
    value: null
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('returns 200', function () { pm.response.to.have.status(200); });
      pm.test('success is true', function () { pm.expect(json.success).to.eql(true); });
      pm.test('items is an array', function () { pm.expect(json.data.items).to.be.an('array'); });
      pm.test('pagination metadata present', function () {
          pm.expect(json.data.total).to.be.a('number');
          pm.expect(json.data.page).to.be.a('number');
          pm.expect(json.data.limit).to.be.a('number');
      });
      pm.test('page 2 respected', function () { pm.expect(json.data.page).to.eql(2); });
      pm.test('limit respected', function () { pm.expect(json.data.limit).to.eql(10); });
      pm.test('at most 10 items', function () { pm.expect(json.data.items.length).to.be.at.most(10); });
    language: text/javascript
order: 13000
