$kind: http-request
description: Search by specialization name. Specialization matching uses the normalized training_specializations -> specializations relations via EXISTS.
url: "{{base_url}}/api/v1/search/trainings?q=Engineering"
method: GET
headers:
  Accept: application/json
queryParams:
  q: Engineering
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('search returns 200', function () { pm.response.to.have.status(200); });
      pm.test('success is true', function () { pm.expect(json.success).to.eql(true); });
      pm.test('items is an array', function () { pm.expect(json.data.items).to.be.an('array'); });
      pm.test('pagination metadata present', function () {
          pm.expect(json.data.total).to.be.a('number');
          pm.expect(json.data.page).to.be.a('number');
          pm.expect(json.data.limit).to.be.a('number');
          pm.expect(json.data.query).to.be.a('string');
      });
      const json = pm.response.json();
      pm.test('results carry specializations arrays', function () {
          json.data.items.forEach(function (item) { pm.expect(item.specializations).to.be.an('array'); });
      });
    language: text/javascript
order: 5000
