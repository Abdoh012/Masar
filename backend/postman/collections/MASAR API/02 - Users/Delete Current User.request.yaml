$kind: http-request
description: Requires Bearer token + CSRF header (attached automatically) + a `confirm_deletion` token (any non-empty string). Deactivates the account. DESTRUCTIVE - only run against disposable test accounts.
url: "{{base_url}}/api/v1/users/me"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "confirm_deletion": "delete-my-account"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      let csrf = pm.cookies.get('csrf_token');
      if (!csrf) {
          csrf = pm.collectionVariables.get('csrf_token');
      }
      if (csrf) {
          pm.request.headers.upsert({ key: 'X-CSRF-Token', value: csrf });
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Delete current user succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.message).to.eql('Account deleted successfully.');
      });
    language: text/javascript
order: 4000
