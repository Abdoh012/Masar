$kind: http-request
description: Requires Bearer token + CSRF header (attached automatically) + a `confirm_deletion` token (any non-empty string). Deactivates the account. DESTRUCTIVE - only run against disposable test accounts.
url: "{{base_url}}/api/v1/users/me"
method: DELETE
headers:
  Content-Type: application/json
  X-CSRF-Token: "{{csrf_token}}"
body:
  type: json
  content: |-
    {
        "confirm_deletion": "delete-my-account"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
order: 4000
