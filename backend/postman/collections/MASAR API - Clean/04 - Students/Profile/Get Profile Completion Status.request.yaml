$kind: http-request
description: "Requires a student Bearer token. Returns profile completion status: `completed` (boolean), `missing_fields`, and `completion_percentage`. Completion requires university, faculty, specialization, at least one skill and a CV."
url: "{{base_url}}/api/v1/students/profile/status"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Profile status returned", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.have.property('completed');
          pm.expect(json.data).to.have.property('missing_fields');
          pm.expect(json.data).to.have.property('completion_percentage');
          pm.expect(Array.isArray(json.data.missing_fields)).to.eql(true);
          pm.expect(json.data.completion_percentage).to.be.a('number');
          pm.expect(json.data.completion_percentage).to.be.at.least(0);
          pm.expect(json.data.completion_percentage).to.be.at.most(100);
      });
      pm.test("Completion uses field, specialization, skills and CV only (total 4)", function () {
          const json = pm.response.json();
          const allowed = ['field_id', 'specialization_id', 'skills', 'cv'];
          const missing = json.data.missing_fields || [];
          for (const key of missing) {
              pm.expect(allowed).to.include(key);
          }
      });
    language: text/javascript
order: 4000
