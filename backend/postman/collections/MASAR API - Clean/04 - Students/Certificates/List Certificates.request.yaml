$kind: http-request
description: Requires a Bearer token. Lists certificates. For a student this returns their own issued certificates; supports status, student_id, training_id, company_id, limit and offset filters.
url: "{{base_url}}/api/v1/certificates"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Certificates listed", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 1000
