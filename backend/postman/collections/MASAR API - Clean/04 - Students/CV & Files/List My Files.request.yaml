$kind: http-request
description: Requires a Bearer token. Lists the authenticated user's files (supports page, limit, type and search query filters).
url: "{{base_url}}/api/v1/files"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Files list returned", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(Array.isArray(json.data)).to.eql(true);
      });
    language: text/javascript
order: 2000
