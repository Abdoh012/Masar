$kind: http-request
description: "Requires a student Bearer token. Removes the CV: deletes the physical file from storage and removes its record, then clears the student CV reference. Returns 404 when the student has no CV."
url: "{{base_url}}/api/v1/students/me/cv"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      const deletedFileId = pm.collectionVariables.get("cv_file_id");

      pm.test("Remove CV succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.be.an("object");
          pm.expect(json.data.message).to.eql("CV removed successfully.");
      });

      pm.test("A CV file must have been uploaded before removal", function () {
          pm.expect(deletedFileId, "cv_file_id is not set").to.be.ok;
      });

      if (deletedFileId) {
          const base = pm.collectionVariables.get("base_url") || "http://localhost/Masar/backend";
          const auth = [{ key: "Authorization", value: "Bearer " + pm.collectionVariables.get("access_token") }];

          pm.sendRequest({ url: base + "/api/v1/students/me/cv", method: "GET", header: auth }, function (err, res) {
              pm.test("GET /students/me/cv no longer references a CV", function () {
                  pm.expect(err).to.not.be.ok;
                  pm.expect(res.code).to.eql(200);
                  const body = res.json();
                  pm.expect(body.success).to.eql(true);
                  pm.expect(body.data).to.have.property("cv_file_id");
                  pm.expect(body.data.cv_file_id).to.eql(null);
              });
          });

          pm.sendRequest({ url: base + "/api/v1/files?limit=100", method: "GET", header: auth }, function (err, res) {
              pm.test("Deleted CV is no longer listed in My Files", function () {
                  pm.expect(err).to.not.be.ok;
                  const body = res.json();
                  pm.expect(body.success).to.eql(true);
                  const items = Array.isArray(body.data) ? body.data : (body.data && body.data.items) || [];
                  const stillPresent = items.some(function (f) {
                      return f && String(f.id) === String(deletedFileId);
                  });
                  pm.expect(stillPresent, "file " + deletedFileId + " must not appear in the files list").to.eql(false);
              });
          });

          pm.sendRequest({ url: base + "/api/v1/files/" + deletedFileId, method: "GET", header: auth }, function (err, res) {
              pm.test("Deleted CV metadata is gone (file record returns 400/404)", function () {
                  pm.expect(err).to.not.be.ok;
                  pm.expect(res.code).to.be.oneOf([400, 404]);
              });
          });

          pm.collectionVariables.set("cv_file_id", "");
          pm.collectionVariables.set("file_id", "");
      }
    language: text/javascript
order: 6000
