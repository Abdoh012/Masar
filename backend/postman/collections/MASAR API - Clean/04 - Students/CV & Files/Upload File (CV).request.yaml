$kind: http-request
description: "Requires a Bearer token (any role; the file is owned by the authenticated user). Uploads a file via multipart form-data. The `file` field holds the binary file and `type` is a text field (allowed values: cv, profile_image, certificate_attachment, other; defaults to other). Max 10MB, pdf/doc/docx/jpg/png/etc. The backend returns the uploaded file record in `data`; its `id` is captured into the collection variables `file_id` and `cv_file_id` (used by `Set CV`, `Complete Student Profile` and other Student requests)."
url: "{{base_url}}/api/v1/files"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
    - type: text
      key: type
      value: cv
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      const previousCvFileId = pm.collectionVariables.get("cv_file_id");
      const rawId = json && json.data ? json.data.id : undefined;
      const hasValidId =
          (typeof rawId === "number" && rawId > 0) ||
          (typeof rawId === "string" && /^[0-9]+$/.test(rawId) && Number(rawId) > 0);
      const uploadSucceeded = pm.response.code === 201 && json && json.success === true && hasValidId;

      if (uploadSucceeded) {
          const fileId = String(rawId);
          pm.collectionVariables.set("cv_file_id", fileId);
          pm.collectionVariables.set("file_id", fileId);
      } else {
          const reason = (json && json.message) ? json.message : "no data.id in response body";
          console.log("cv_file_id NOT updated: upload failed or file id missing. Reason: " + reason + " Previous value preserved.");
      }

      pm.test("File upload succeeds", function () {
          pm.expect(pm.response.code).to.eql(201);
          pm.expect(json).to.be.an("object");
          pm.expect(json.success).to.eql(true);
      });

      pm.test("Upload response contains a file id in data.id", function () {
          pm.expect(json.data).to.be.an("object");
          pm.expect(rawId).to.be.ok;
      });

      if (uploadSucceeded) {
          pm.test("cv_file_id collection variable is set to a valid non-empty id", function () {
              const cvFileId = pm.collectionVariables.get("cv_file_id");
              pm.expect(cvFileId, "cv_file_id must exist").to.be.ok;
              pm.expect(String(cvFileId).trim(), "cv_file_id must be non-empty").to.not.eql("");
              pm.expect(Number(cvFileId), "cv_file_id must be a positive number").to.be.above(0);
          });
      }

      if (!uploadSucceeded) {
          pm.test("Failed upload did not overwrite existing cv_file_id", function () {
              pm.expect(pm.collectionVariables.get("cv_file_id")).to.eql(previousCvFileId);
          });
      }
    language: text/javascript
order: 1000
