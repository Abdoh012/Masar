$kind: http-request
description: Public. Resends the password reset OTP for the given email (query parameter).
url: "{{base_url}}/api/v1/auth/resend-reset-otp?email={{student_email}}"
method: GET
queryParams:
  email: "{{student_email}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Reset OTP resend succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 12000
