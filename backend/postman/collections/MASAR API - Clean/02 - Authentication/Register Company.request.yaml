$kind: http-request
description: 'Public. Creates a company account (status `pending` until admin approval). `industry` is the company specialization: it must match an active row of the shared `specializations` table (same list students choose their Specialization from) and is stored in `company_specializations`. It can be a single ID (e.g. 92), a single name ("Mechanical Engineering"), or an array of either (`[92, 103]` / `["Software Engineering"]`). Expected: 201. No token is returned for company registrations. Omitting `industry`, or an unknown ID/name, returns 422. A 409 means the email is already registered.'
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{register_company_email}}",
        "password": "{{register_company_password}}",
        "password_confirmation": "{{register_company_password}}",
        "accept_terms": true,
        "role": "company",
        "company_name": "MASAR Test Solutions",
        "industry": 92,
        "description": "A test company used to verify company registration."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Company registration succeeds or already exists", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 409]);
      });
      if (pm.response.code === 201) {
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.user.role).to.eql('company');
      }
    language: text/javascript
order: 3000
