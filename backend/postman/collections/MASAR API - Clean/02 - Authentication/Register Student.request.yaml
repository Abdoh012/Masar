$kind: http-request
description: 'Public. Creates a student account (status `active`) using the current model: `field` (an active `study_fields.id`, e.g. 9) and `specialization` (an active `specializations.id` under that field, e.g. 92 = Mechanical Engineering). The specialization must belong to the selected field, otherwise 422 `"User field or specialization is incorrect."`. Names are still accepted for backward compatibility. Values come from the Lookups endpoints. Expected: 201 with `data.user` and an access `token`. A 409 means the email is already registered.'
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "full_name": "Test Student",
        "email": "{{register_student_email}}",
        "password": "{{register_student_password}}",
        "password_confirmation": "{{register_student_password}}",
        "accept_terms": true,
        "role": "student",
        "field": 9,
        "specialization": 92
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Student registration succeeds or already exists", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 409]);
      });
      if (pm.response.code === 201) {
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.user.role).to.eql('student');
          pm.expect(json.data.user.status).to.eql('active');
          pm.expect(json.data.token).to.be.ok;
          pm.collectionVariables.set('access_token', json.data.token);
          pm.collectionVariables.set('user_id', String(json.data.user.id));
          pm.collectionVariables.set('user_role', json.data.user.role);
      }
    language: text/javascript
order: 2000
