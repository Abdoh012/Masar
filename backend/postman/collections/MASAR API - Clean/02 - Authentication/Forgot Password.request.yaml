$kind: http-request
description: Public. Requests a 6-digit password reset OTP for the email. The OTP is delivered by email (never in the response); paste it into the `reset_token` collection variable. The response is generic so account existence is not revealed.
url: "{{base_url}}/api/v1/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{student_email}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Password reset OTP request succeeds", function () {
          pm.expect(pm.response.code).to.eql(200);
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 11000
