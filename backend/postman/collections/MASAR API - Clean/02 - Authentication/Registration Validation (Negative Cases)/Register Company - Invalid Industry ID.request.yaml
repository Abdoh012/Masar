$kind: http-request
description: "Negative. `industry` is a non-existent `specializations.id`. Expected: 422 with message `One or more specializations are not recognized.`"
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{$randomEmail}}",
        "password": "{{register_company_password}}",
        "password_confirmation": "{{register_company_password}}",
        "accept_terms": true,
        "role": "company",
        "company_name": "MASAR Bad Industry",
        "industry": 999999,
        "description": "x"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Invalid industry ID is rejected", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.message).to.eql('One or more specializations are not recognized.');
      });
    language: text/javascript
order: 7000
