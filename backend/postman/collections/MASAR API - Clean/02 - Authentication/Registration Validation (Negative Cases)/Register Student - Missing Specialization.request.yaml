$kind: http-request
description: "Negative. Omits `specialization`. Expected: 422 with `errors.specialization` = `Specialization is required.`"
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "full_name": "Test Student",
        "email": "{{$randomEmail}}",
        "password": "{{register_student_password}}",
        "password_confirmation": "{{register_student_password}}",
        "accept_terms": true,
        "role": "student",
        "field": 9
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Missing specialization is rejected", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.errors.specialization[0]).to.eql('Specialization is required.');
      });
    language: text/javascript
order: 5000
