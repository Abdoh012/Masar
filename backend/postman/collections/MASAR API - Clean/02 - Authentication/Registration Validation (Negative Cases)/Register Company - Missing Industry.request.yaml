$kind: http-request
description: "Negative. Omits `industry`. Expected: 422 with `errors.industry` = `Industry is required for company registration.`"
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{$randomEmail}}",
        "password": "{{register_company_password}}",
        "password_confirmation": "{{register_company_password}}",
        "accept_terms": true,
        "role": "company",
        "company_name": "MASAR No Industry",
        "description": "x"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Missing industry is rejected", function () {
          pm.expect(pm.response.code).to.eql(422);
          const json = pm.response.json();
          pm.expect(json.errors.industry[0]).to.eql('Industry is required for company registration.');
      });
    language: text/javascript
order: 6000
