  /search/students:
    get:
      tags: [Search]
      summary: Search student candidates
      description: >-
        Keyword search over `students.full_name` (LIKE), ordered `id DESC`.
        The keyword is REQUIRED and must be 2-255 characters; without it the
        request is refused with 400 "Search query is required."

        Optional `skill_id` narrows the result to candidates holding the given
        skill(s), resolved through the existing normalized `student_skills`
        relation - never a text column. It accepts a single id (`skill_id=5`),
        a repeated parameter (`skill_id[]=5&skill_id[]=9`) or a comma-separated
        list (`skill_id=5,9`). Ids are used rather than names, matching the
        existing training filter and docs/api/search.md.

        SEMANTICS: multiple ids mean ANY, not ALL. A candidate matches when they
        hold at least one of the requested skills. A single id is the same rule
        with one element.

        Implemented with an EXISTS subquery, so a candidate holding several of
        the requested skills is still returned exactly once and `total` stays
        correct. A non-numeric or non-positive id is a 422; an id that simply
        does not exist yields an empty result rather than an error.

        Each row is `{ id, user_id, full_name, username }`. `username` is the
        student's PUBLIC HANDLE, which is nullable and is not backfilled - it is
        never substituted with the account email.
      parameters:
        - name: q
          in: query
          required: true
          description: Search keyword matched against full_name. 2-255 characters. Also accepted as `query` or `search`.
          schema: { type: string, minLength: 2, maxLength: 255 }
        - name: skill_id
          in: query
          required: false
          description: >-
            Filter by skill. Repeatable and comma-separated forms are accepted
            and mean ANY of the listed skills.
          schema:
            oneOf:
              - type: integer
                minimum: 1
              - type: array
                items: { type: integer, minimum: 1 }
          style: form
          explode: true
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

