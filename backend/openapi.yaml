  /conversations:
    get:
      tags: [Messaging]
      summary: List conversations for the current user
      description: >-
        Requires a Bearer token. Returns the conversations the authenticated
        user participates in, on the student or company side of an application.
        `data` is `{ items, pagination }`: `items` is the page of conversation
        rows and `pagination` is `{ total, limit, offset }`, where `total` is
        the number of the user's conversations before paging, computed with
        the same visibility and filters as the list.

        Each conversation row additionally carries:

        * `last_message`: the conversation's latest message (`id`, `body`,
          `sender_user_id`, `created_at`), or `null` when the conversation has
          no messages. The latest message is the newest by `created_at` then
          `id`.
        * `application_status`: the status of the linked training application,
          read live from the database.
        * `training`: `{ title, starts_at, ends_at }` of the linked training
          listing, or `null` when no training listing is linked. Dates are
          returned as stored and are `null` when the listing has none.

        Query parameters are read from the query string only (never from a
        body) and are validated: an out-of-range or non-numeric value is a 400
        with the offending field in `errors`.

        `limit` defaults to 20 and accepts 1-100; `offset` defaults to 0 and
        must be >= 0. Optional filters are `application_id` (positive integer;
        a filter for an application the user is not a participant of returns an
        empty page) and `keyword` (LIKE over the student name, company name
        and training title).

        Withdrawal does NOT hide a conversation or its history: both
        participants keep read access, only sending is refused (403).
      parameters:
        - name: application_id
          in: query
          required: false
          description: Only the conversation linked to this training application.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: keyword
          in: query
          required: false
          description: LIKE filter over the student name, company name and training title.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size. Must be between 1 and 100; defaults to 20.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          description: Rows to skip. Must be >= 0; defaults to 0.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: The authenticated user's conversations with the latest message preview, application status, training info and pagination metadata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MessagingConversationListData' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [Messaging]
      summary: Start (or return) the conversation for an accepted application
      description: >-
        Requires a Bearer token and a body containing `application_id`.

        The participants are derived from the application: the student and the
        company are read from the application/training, never from the client.
        The application must exist (404), be `accepted` (422), and the
        authenticated user must be its student or its company (403). A missing
        or non-numeric `application_id` is a 422.

        `application_id` is unique per conversation, so the endpoint is
        idempotent: an existing conversation is returned with 200 and
        `Conversation already exists.`; a new one is 201 with
        `Conversation created successfully.`. Concurrent requests resolve to the
        same conversation instead of creating duplicates.

        `title`, `name`, `participant_id`, `participant_ids` and `participants`
        are not persisted by the conversations table and are rejected with 422
        instead of being silently ignored. Group conversations are not
        supported.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessagingConversationCreateRequest' }
      responses:
        '201':
          description: Conversation created successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MessagingConversation' }
        '200':
          description: Conversation already exists; the existing row is returned unchanged.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MessagingConversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

  /conversations/{id}/messages:
    get:
      tags: [Messaging]
      summary: List messages in a conversation (cursor pagination)
      description: >-
        Requires a Bearer token. `data` stays a flat array ordered by the
        auto-increment `id`, oldest to newest. Pagination metadata is returned
        as a sibling of `data` in the standard envelope; only one bounded page
        is ever read from MySQL. A `conversation` object is also returned at
        the top level: `{ id, company: { id, name, image } }`, the
        conversation's header for a WhatsApp-style display. `company.image` is
        the company's relative storage path from `companies.company_logo`
        (null when the company has no logo). It is fetched once per request
        and never added to message objects.

        The default request returns the latest 12 messages: the query scans
        `ORDER BY id DESC LIMIT limit + 1` (served by the composite
        `(conversation_id, id)` index) and the result is reversed to
        chronological order. The extra row is used only to compute `has_more`
        and is never returned. No total-count query is performed.

        `limit` defaults to 12 and accepts 1-20; 0, 21, negative and
        non-numeric values are a 400. `before_id` returns messages with a lower
        id (older page) and `after_id` returns messages with a greater id
        (newer page), both exclusive of the cursor. Both modes are returned in
        chronological order. The cursor message is never included. Supplying
        both cursors is a 400 with `errors.before_id_after_id`. A non-numeric or
        non-positive cursor is a 400; a positive cursor that does not exist is
        safe and yields the nearest page.

        `offset`, `order`, `sender_id`, `from_date` and `to_date` remain
        accepted for backward compatibility. `order` is a display-only
        override (the cursor mechanics are identical in every mode), and
        `from_date` / `to_date` accept `Y-m-d` or `Y-m-d H:i:s`, with a
        date-only `to_date` covering the whole day (until 23:59:59).

        `pagination` contains `limit`, `has_more`, `next_before_id` (oldest id
        in the page; use as `before_id` for older messages) and `next_after_id`
        (newest id in the page; use as `after_id` for newer messages). Empty
        conversations return `data: []` with `has_more: false`.

        A nonexistent conversation is a 404, a conversation the user does not
        participate in is a 403, and a missing/invalid token is a 401.
        Withdrawal does not change reading: the full history stays available to
        both participants.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: limit
          in: query
          required: false
          description: Page size. Must be between 1 and 20; defaults to 12.
          schema: { type: integer, minimum: 1, maximum: 20, default: 12 }
        - name: before_id
          in: query
          required: false
          description: >-
            Exclusive cursor: only messages with an id lower than this value
            (older page). Cannot be combined with after_id.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: after_id
          in: query
          required: false
          description: >-
            Exclusive cursor: only messages with an id greater than this value
            (newer page). Cannot be combined with before_id.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: offset
          in: query
          required: false
          deprecated: true
          description: Legacy offset. Must be >= 0; defaults to 0.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: order
          in: query
          required: false
          deprecated: true
          description: >-
            Legacy display-only override. Pages are always cursor-based; the
            default asc presents messages oldest to newest.
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: sender_id
          in: query
          required: false
          description: Only messages sent by this user id.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: from_date
          in: query
          required: false
          description: Lower bound on created_at. Accepts Y-m-d or Y-m-d H:i:s.
          schema: { type: string, example: '2026-08-14 11:00:00' }
        - name: to_date
          in: query
          required: false
          description: >-
            Upper bound on created_at. Accepts Y-m-d or Y-m-d H:i:s; a
            date-only value is expanded to 23:59:59 of that day.
          schema: { type: string, example: '2026-08-15' }
      responses:
        '200':
          description: One page of messages in chronological order with pagination metadata and the conversation header.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MessagingMessage' }
                      pagination: { $ref: '#/components/schemas/MessagingMessagePagination' }
                      conversation: { $ref: '#/components/schemas/MessagingConversationHeader' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [Messaging]
      summary: Send a message in a conversation
      description: >-
        Requires a Bearer token. The conversation id is taken from the URL and
        is authoritative. A body `conversation_id` is optional, but when it is
        present and does not match the URL the request is refused with 422.

        The sender is always the authenticated user. `sender_user_id`,
        `sender_id` and `user_id` are never accepted as authority: a value that
        differs from the token's user is a 422, and the field is ignored when
        identical.

        `body` is the canonical field (5000 characters maximum, valid UTF-8,
        trimmed, non-empty). `message` and `content` remain accepted as
        aliases. `message_type`, `reply_to_id`, `attachment_ids`, `attachments`
        and `file_id` have no persistent storage in this phase and are rejected
        with 422 rather than ignored.

        The insert and the conversation's `updated_at` update happen in one
        transaction: on any failure both are rolled back and the client receives
        a safe 500 without database details.

        Sending is refused with 403 when the linked training application is
        `withdrawn` (status is re-read from the database on every send). Reading
        the conversation and its history is unaffected. Sending is rate limited
        per user (60 requests / minute when rate limiting is enabled).

        The insert, the conversation `updated_at` update and the `message_events`
        outbox row commit in one transaction. The WebSocket server broadcasts
        the resulting `message.created` event only after that commit.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessagingMessageCreateRequest' }
      responses:
        '201':
          description: The message was stored in the URL conversation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MessagingMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Error' }

  /conversations/{id}/messages/{message_id}:
    patch:
      tags: [Messaging]
      summary: Edit your own message
      description: >-
        Requires a Bearer token. Editing is available on any message the
        authenticated user owns, with no time limit. The message must belong to
        the conversation in the URL path: it is retrieved using the message id
        AND the conversation id, and the sender is re-read from the database.

        `body` is the canonical field (5000 characters maximum, valid UTF-8,
        trimmed, non-empty) — the same rules as message creation; `message` and
        `content` remain accepted aliases. An empty or whitespace-only body is a
        422.

        Effects: the message body is updated, `is_edited` is set to 1, and
        `updated_at` is set to the current timestamp. `id` and the original
        `created_at` are never modified.

        Authorization: the message is loaded with the message id and the URL
        conversation id. Non-participants get a 403, messages from other
        conversations 404, and messages owned by someone else 403 ("You can
        only edit your own messages."). Withdrawn applications: reading remains
        allowed, but editing is refused with 403, consistent with the send
        restriction.

        Returns the updated message via the standard success envelope. The
        `message.updated` event is published after the transaction commits.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: message_id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessagingMessageUpdateRequest' }
      responses:
        '200':
          description: The updated message.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MessagingMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

    delete:
      tags: [Messaging]
      summary: Delete your own message (Delete for Everyone)
      description: >-
        Requires a Bearer token. Deletes a message owned by the authenticated
        user with a HARD DELETE: the row is physically removed from the
        `messages` table. There is no soft delete, no placeholder body, no
        `deleted_at`, and the conversation and all other messages are untouched.

        Ownership and conversation membership are verified from the database
        using the message id and URL conversation id; non-participants get a
        403, messages from other conversations 404, messages owned by someone
        else 403 ("You can only delete your own messages."), and already-deleted
        or nonexistent messages 404. Withdrawn applications: deletion is
        refused with 403, consistent with the send restriction; reading remains
        allowed.

        After deletion:
        * the message no longer appears in message retrieval responses;
        * it no longer contributes to `unread_count`;
        * the conversation's latest message is recalculated from remaining
          messages (`last_message: null` when none remain).

        The `message.deleted` event (which carries only `message_id`,
        `conversation_id` and `deleted_by` — never the body) is published after
        the transaction commits.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: message_id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: The message was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Error' }

  /search:
    get:
      tags: [Search]
      summary: Unified search
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /search/users:
    get:
      tags: [Search]
      summary: Search users
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /search/companies:
    get:
      tags: [Search]
      summary: Search companies
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /search/trainings:
    get:
      tags: [Search]
      summary: Search trainings
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /search/students:
    get:
      tags: [Search]
      summary: Search student candidates
      description: >-
        Keyword search over `students.full_name` (LIKE), ordered `id DESC`.
        The keyword is REQUIRED and must be 2-255 characters; without it the
        request is refused with 400 "Search query is required."

        Optional `skill_id` narrows the result to candidates holding the given
        skill(s), resolved through the existing normalized `student_skills`
        relation - never a text column. It accepts a single id (`skill_id=5`),
        a repeated parameter (`skill_id[]=5&skill_id[]=9`) or a comma-separated
        list (`skill_id=5,9`). Ids are used rather than names, matching the
        existing training filter and docs/api/search.md.

        SEMANTICS: multiple ids mean ANY, not ALL. A candidate matches when they
        hold at least one of the requested skills. A single id is the same rule
        with one element.

        Implemented with an EXISTS subquery, so a candidate holding several of
        the requested skills is still returned exactly once and `total` stays
        correct. A non-numeric or non-positive id is a 422; an id that simply
        does not exist yields an empty result rather than an error.

        Each row is `{ id, user_id, full_name, username }`. `username` is the
        student's PUBLIC HANDLE, which is nullable and is not backfilled - it is
        never substituted with the account email.
      parameters:
        - name: q
          in: query
          required: true
          description: Search keyword matched against full_name. 2-255 characters. Also accepted as `query` or `search`.
          schema: { type: string, minLength: 2, maxLength: 255 }
        - name: skill_id
          in: query
          required: false
          description: >-
            Filter by skill. Repeatable and comma-separated forms are accepted
            and mean ANY of the listed skills.
          schema:
            oneOf:
              - type: integer
                minimum: 1
              - type: array
                items: { type: integer, minimum: 1 }
          style: form
          explode: true
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /search/certificates:
    get:
      tags: [Search]
      summary: Search certificates
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /search/suggestions:
