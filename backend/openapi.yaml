components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: MASAR_REFRESH
      description: HttpOnly refresh-token cookie
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for cookie-based state-changing requests

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:
    StudentHeader:
      type: object
      description: >-
        The complete GET /students/me header contract. Exactly these thirteen
        fields, no more.
      required:
        - id
        - academic_status
        - is_profile_complete
        - updated_at
        - bio
        - field
        - profile_image_url
        - profile_image_file_id
        - full_name
        - specialization
        - university
        - faculty
        - member_since
      additionalProperties: false
      properties:
        id: { type: integer, example: 1498 }
        academic_status: { type: string, nullable: true, example: student }
        is_profile_complete:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Completion PERCENTAGE (0-100) computed from field_id,
            specialization_id, at least one skill and an attached CV. The same
            canonical value GET /students/profile/status returns. This is NOT
            the stored students.is_profile_complete boolean column.
          example: 50
        updated_at: { type: string, nullable: true, example: '2026-10-01 02:48:57' }
        bio: { type: string, nullable: true }
        field:
          type: string
          nullable: true
          description: study_fields.name behind students.field_id; null when unset.
          example: Engineering
        profile_image_url:
          type: string
          nullable: true
          description: Public API download URL; the filesystem path is never exposed.
          example: 'http://localhost/Masar/backend/api/v1/files/544?download=true'
        profile_image_file_id: { type: integer, nullable: true, example: 544 }
        full_name: { type: string, nullable: true, example: Mohamed Ahmed }
        specialization: { type: string, nullable: true, example: Backend Development }
        university: { type: string, nullable: true }
        faculty: { type: string, nullable: true }
        member_since:
          type: string
          nullable: true
          description: users.created_at formatted as ISO-8601 with a timezone offset.
          example: '2026-09-02T05:23:43+03:00'
    StudentMeData:
      type: object
      required: [header]
      additionalProperties: false
      properties:
        header: { $ref: '#/components/schemas/StudentHeader' }
    StudentContactData:
      type: object
      required: [email, phone, website, external_profile, address]
      additionalProperties: false
      properties:
        email: { type: string, format: email, example: student@example.com }
        phone: { type: string, nullable: true, maxLength: 50, example: '01112345682' }
        website: { type: string, format: uri, nullable: true, maxLength: 255, example: 'https://student.example.com' }
        external_profile: { type: string, format: uri, nullable: true, maxLength: 255, example: 'https://www.linkedin.com/in/student' }
        address: { type: string, nullable: true, maxLength: 500, example: 'New Cairo, Cairo' }
    ApplicationStatusSummary:
      type: object
      description: >-
        The student's total number of applications per lifecycle status across
        all pages (not just the current page). The same summary is returned by
        all four tab endpoints and only counts the authenticated student's own
        applications.
      required: [applied_count, accepted_count, rejected_count, withdrawn_count]
      additionalProperties: false
      properties:
        applied_count:
          type: integer
          minimum: 0
          description: Applications whose DB status is submitted (displayed as Applied).
          example: 4
        accepted_count: { type: integer, minimum: 0, example: 2 }
        rejected_count: { type: integer, minimum: 0, example: 1 }
        withdrawn_count: { type: integer, minimum: 0, example: 3 }
    StudentApplicationListData:
      type: object
      required: [summary, items, pagination]
      properties:
        summary: { $ref: '#/components/schemas/ApplicationStatusSummary' }
        items:
          type: array
          description: >-
            The tab's card DTO items. The item shape depends on the endpoint
            (Applied, Accepted, Rejected or Withdrawn card DTO).
          items: { type: object }
        pagination:
          type: object
          required: [current_page, per_page, total, total_pages, has_next_page, has_previous_page]
          properties:
            current_page: { type: integer, minimum: 1, example: 1 }
            per_page: { type: integer, minimum: 1, example: 20 }
            total: { type: integer, minimum: 0, example: 4 }
            total_pages: { type: integer, minimum: 0, example: 1 }
            has_next_page: { type: boolean, example: false }
            has_previous_page: { type: boolean, example: false }
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, nullable: true }
        data: { type: object, nullable: true }
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors: { type: object, nullable: true }
    ValidationErrors:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Validation failed. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, super_admin, student, company, trainer, moderator, employee] }
        status: { type: string, enum: [active, inactive, suspended, pending] }
    RegisterRequest:
      type: object
      required: [full_name, email, password, password_confirmation, accept_terms, role]
      properties:
        full_name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }
        accept_terms: { type: boolean }
        role: { type: string, enum: [student, company] }
        field: { type: string, description: Required for students; must match seeded lookup }
        specialization: { type: string, description: Required for students; must match seeded lookup }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          format: password
          description: The account's current password. Must verify, otherwise the change is refused with 400.
        new_password:
          type: string
          format: password
          minLength: 12
          description: >-
            The new password. Policy (enforced by security_password_strength_errors(),
            the single source of truth shared with register and reset-password):
            at least 12 characters, with at least one lowercase letter, one
            uppercase letter, one digit and one special character. Must differ
            from the current password.
        new_password_confirmation:
          type: string
          format: password
          description: Must equal new_password exactly.
      description: >-
        Body of POST /auth/change-password. The field names are
        current_password / new_password / new_password_confirmation.

        On success the account's password_hash is rewritten and every row in
        `auth_tokens` and `refresh_tokens` for that user is revoked, the current
        device's access token is blacklisted, and the remember-me and refresh
        cookies are cleared.

        SESSION BEHAVIOUR: access tokens are stateless JWTs and are not
        persisted when issued, so other devices are NOT signed out immediately.
        An outstanding access token on another device remains valid until it
        expires on its own (JWT_ACCESS_TTL, default 3600 seconds = 1 hour) and
        then fails to refresh. See docs/api/authentication.md.

        No application, training, payment or certificate record is read or
        written by this endpoint.
    CertificateStatistics:
      type: object
      required: [total, eligible, pending, issued, revoked]
      properties:
        total:
          type: integer
          description: Persisted certificate records in scope. Never includes eligible.
          example: 14
        eligible:
          type: integer
          description: Students eligible to request a certificate. Not a persisted status.
          example: 8
        pending:
          type: integer
          description: Persisted certificate requests awaiting review.
          example: 5
        issued:
          type: integer
          description: Certificates currently issued and not revoked.
          example: 6
        revoked:
          type: integer
          description: Certificates that have been revoked.
          example: 3

  responses:
    Success:
      description: Successful operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    StudentMeSuccess:
      description: >-
        The authenticated student's self header. `data` contains `header` and
        nothing else.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/StudentMeData' }
    StudentContactSuccess:
      description: >-
        The authenticated student's five-field contact details. Unset optional
        fields are null, and no other contact field is returned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/StudentContactData' }
    StudentApplicationListSuccess:
      description: >-
        The authenticated student's applications for the tab plus a `summary`
        object with the total count per status across all pages.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/StudentApplicationListData' }
    CertificateStatisticsSuccess:
      description: Certificate statistics for the authenticated user's scope
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/CertificateStatistics' }
    AuthSuccess:
      description: Authenticated successfully (access token returned; refresh cookie set)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    NoContent:
      description: No content
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrors' }
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Error:
      description: The request could not be processed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
