  /files/{id}:
    get:
      tags: [Files]
      summary: Get file metadata or download a signed profile image
      description: >-
        With a Bearer token, returns metadata for a file owned by the caller;
        `?download=true` streams the bytes (attachment). A request carrying a
        valid short-lived `expires` + `signature` pair issued by
        `profile_image_url` instead streams the profile image inline and does
        not need an Authorization header. Signed access is honoured ONLY for
        rows typed profile_image whose bytes are an allowed image MIME
        (png, jpeg or webp): a signed URL for a CV, an academic certificate or
        any other file type resolves to 404, and those files still require a
        Bearer token plus an ownership check. Expired or tampered signatures
        are 401.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: download
          in: query
          required: false
          description: Stream the file bytes instead of returning metadata.
          schema: { type: boolean }
        - name: expires
          in: query
          required: false
          description: Unix expiry of a signed profile-image URL.
          schema: { type: integer }
        - name: signature
          in: query
          required: false
          description: HMAC-SHA256 signature for a signed profile-image URL.
          schema: { type: string }
      responses:
        '200':
          description: >-
            JSON file metadata, an attachment stream for `?download=true`, or
            the inline profile-image bytes for a valid signed URL. The signed
            response uses the detected image MIME type (png, jpeg or webp).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
            application/octet-stream:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
