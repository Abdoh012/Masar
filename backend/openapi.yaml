openapi: 3.0.3

info:
  title: MASAR API
  version: 1.0.0
  description: |
    REST API for MASAR, a platform connecting students with companies that offer
    training and internship opportunities.

    - All request and response bodies are JSON unless noted.
    - Authentication uses a JWT access token (Bearer) plus an HttpOnly refresh
      cookie. Cookie-based state-changing requests must also send the CSRF
      header (`X-CSRF-Token` by default).
    - Paths below are relative to the server URL, which already includes `/api/v1`.
    - See `docs/api/*.md` for field-level detail per domain and `ERRORS.md` for
      the error envelope.
  contact:
    name: MASAR Backend

servers:
  - url: http://localhost/Masar/backend/api/v1
    description: Local Laragon development

tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Students
  - name: Companies
  - name: Trainings
  - name: Applications
  - name: Certificates
  - name: Files
  - name: Notifications
  - name: Messaging
  - name: Search
  - name: Lookups
  - name: Admin

security:
  - bearerAuth: []

paths:
  /:
    get:
      tags: [Health]
      summary: API discovery / root
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /health:
    get:
      tags: [Health]
      summary: Service health check
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate an existing user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Issue a new access token from the refresh cookie
      security:
        - refreshCookie: []
          csrfToken: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate the current session
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the currently authenticated user
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Start password recovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /auth/resend-reset-otp:
    get:
      tags: [Authentication]
      summary: Resend the password-reset OTP
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Authentication]
      summary: Resend the password-reset OTP
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /auth/verify-reset-otp:
    post:
      tags: [Authentication]
      summary: Verify the password-reset OTP
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset a password using a valid reset token
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/google:
    get:
      tags: [Authentication]
      summary: Start Google OAuth flow
      security: []
      responses:
        '302': { description: Redirect to Google }

  /auth/google/callback:
    get:
      tags: [Authentication]
      summary: Google OAuth callback
      security: []
      responses:
        '302': { description: Redirect back to the frontend }

  /users/me:
    get:
      tags: [Users]
      summary: Get the current user profile
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Users]
      summary: Update the current user profile
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Users]
      summary: Delete the current user account
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /students/me:
    get:
      tags: [Students]
      summary: Get the authenticated student's profile header
      description: >-
        Returns ONE key under `data`: `header`, the thirteen-field student self
        header. The `student` and `profile` objects this endpoint used to
        expose were removed from the contract and are no longer built.

        The header fields are id, academic_status, is_profile_complete,
        updated_at, bio, field, profile_image_url, profile_image_file_id,
        full_name, specialization, university, faculty and member_since.

        is_profile_complete is a completion PERCENTAGE from 0 to 100 - the same
        value GET /students/profile/status and the dashboard report - not the
        raw students.is_profile_complete column, which remains a boolean flag
        and is stored unchanged.

        Contact details are NOT part of this response; the student reads them on
        GET /students/me/contact. specialization, university and faculty are
        resolved from the lookup tables behind the student's foreign keys.

        The image only resolves when students.profile_image_file_id points at a
        file this student owns AND that is typed profile_image, so a CV, an
        academic certificate or another student's image degrades to null rather
        than being displayed. member_since is users.created_at formatted as
        ISO-8601.

        This is the authenticated self-read; companies browse candidates
        through GET /search/students.
      responses:
        '200': { $ref: '#/components/responses/StudentMeSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }



  /students/profile:
    post:
      tags: [Students]
      summary: Create the student profile
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
    put:
      tags: [Students]
      summary: Update the student profile
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /students/profile/status:
    get:
      tags: [Students]
      summary: Get student profile completion status
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /students/profile/complete:
    post:
      tags: [Students]
      summary: Mark the student profile as complete
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /students/me/skills:
    get:
      tags: [Students]
      summary: List the student's skills
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Students]
      summary: Add a skill
      description: >-
        Adds one skill to the authenticated student's set. `skill` is the skill
        taxonomy lookup id (integer) resolved through the `skills` lookup; a
        free-text name is rejected. Unknown ids answer 422 and are never written
        to the shared taxonomy; an already-held skill answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill]
              properties:
                skill: { type: integer, format: int64, description: Skill taxonomy lookup ID. Integer only; free-text skill names are rejected. }
            example:
              skill: 141
      responses:
        '201': { $ref: '#/components/responses/Success' }
    put:
      tags: [Students]
      summary: Update the student's skills
      description: >-
        Replaces the student's entire skill set. `skills` is a list of skill
        taxonomy lookup ids (integers); every id must exist in the shared
        `skills` lookup. Unknown ids answer 422 and nothing is changed; at most
        50 skills and at least one are required. Never writes to the taxonomy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skills]
              properties:
                skills:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: integer, format: int64 }
            example:
              skills: [131, 139, 152, 141]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Students]
      summary: Remove a skill
      description: >-
        Removes one skill from the authenticated student's set. `skill` is the
        skill taxonomy lookup id (integer) resolved through the `skills` lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill]
              properties:
                skill: { type: integer, format: int64, description: Skill taxonomy lookup ID. Integer only; free-text skill names are rejected. }
            example:
              skill: 141
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /students/me/full-name:
    get:
      tags: [Students]
      summary: Get the authenticated student's full name
      description: >-
        Reads students.full_name for the student resolved from the access token.
        No student id is accepted, so the endpoint can only read the caller's
        own name. The response contains no username, email or password fields.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Students]
      summary: Update the authenticated student's full name
      description: >-
        Writes students.full_name for the student resolved from the access token.
        Any student_id or user_id in the body is ignored. The value is trimmed
        and must be valid UTF-8, 1-255 characters (multibyte characters count as
        characters); control characters are refused. users.username and the
        account password are untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Nour El Sayed
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /students/me/username:
    get:
      tags: [Students]
      summary: Get the authenticated student's public handle
      description: >-
        The public handle is a separate identity from the account email: it is
        what a company sees next to the student's name, and it is never derived
        from, or exposed as, the email. It is nullable and is intentionally not
        backfilled, so an account that has never chosen a handle returns null.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Students]
      summary: Update the authenticated student's public handle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: '^[A-Za-z][A-Za-z0-9_.]{2,29}$'
                  description: >-
                    3-30 characters, must start with a letter, then letters,
                    digits, underscores or dots. Compared case-insensitively and
                    unique across all accounts.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The username is already taken by another account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /students/me/contact:
    get:
      tags: [Students]
      summary: Get the authenticated student's contact details
      description: >-
        Returns exactly five fields: `email` (users.email), `phone`, `website`,
        `external_profile` and `address` (students.*). Unset optional fields are
        `null`. This is the ONLY student endpoint that returns contact details;
        they are deliberately not part of the public student profile, and a
        company receives contact information through the application flow
        instead.
      responses:
        '200': { $ref: '#/components/responses/StudentContactSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Students]
      summary: Update the authenticated student's contact details
      description: >-
        Updates only the supplied fields. `phone`, `website`, `external_profile`
        and `address` need no extra proof; send `null`, an empty string or a
        whitespace-only string to clear an optional field. `website` and
        `external_profile` must be valid URLs when non-empty and are limited to
        255 characters; `address` is limited to 500 characters. Updating `email`
        uses the existing email format and uniqueness checks and does not require
        a password; on success it clears users.email_verified_at so the new
        address is no longer treated as proven. Password changes remain the
        separate POST /auth/change-password flow. The account keeps
        authenticating with email + password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: The account email. Existing format and uniqueness rules apply; no password is required.
                phone:
                  type: string
                  maxLength: 50
                  nullable: true
                  description: Optional phone; digits, spaces and + ( ) - . only, at least one digit; null or blank clears it.
                website:
                  type: string
                  format: uri
                  maxLength: 255
                  nullable: true
                  description: Optional personal website / portfolio URL; null or blank clears it.
                external_profile:
                  type: string
                  format: uri
                  maxLength: 255
                  nullable: true
                  description: Optional external professional profile URL; null or blank clears it.
                address:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: Optional free-text address; null or blank clears it.
      responses:
        '200': { $ref: '#/components/responses/StudentContactSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /students/me/academic-status:
    get:
      tags: [Students]
      summary: Get the authenticated student's academic status
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Students]
      summary: Update the authenticated student's academic status
      description: >-
        Writes students.academic_status ('student' | 'graduate') and, when the
        status is 'graduate', the graduation date (students.graduation_year /
        students.graduation_month, derived from `graduation_date`) and the
        graduation certificate file reference (students.academic_certificate_file_id,
        uploaded through the existing academic-certificate flow).

        A 'student' status requires no further fields and never touches the
        certificate. A 'graduate' status requires `graduation_date`
        (YYYY-MM-DD) and `graduation_certificate` (file).

        This column is NOT a training-eligibility input. Nothing in Applications,
        Trainings or Certificates reads it, so changing it cannot allow or
        disallow a training application. The separate per-application
        training_applications.applicant_type ('student' | 'graduated') is
        untouched.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [academic_status]
              properties:
                academic_status:
                  type: string
                  enum: [student, graduate]
                graduation_date:
                  type: string
                  format: date
                  description: Required when academic_status is graduate (YYYY-MM-DD).
                graduation_certificate:
                  type: string
                  format: binary
                  description: Required when academic_status is graduate (pdf/png/jpg/jpeg, up to 5 MB).
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /students/me/academic-status/certificate:
    delete:
      tags: [Students]
      summary: Delete the authenticated student's graduation certificate
      description: >-
        Removes the graduation certificate associated with the authenticated
        student: verifies ownership, removes the physical file and its record,
        then clears the student reference. Returns 200 on success, 404 when no
        certificate exists.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /students/me/profile-views:
    get:
      tags: [Students]
      summary: Get the authenticated student's profile-view total and recent viewers
      description: >-
        `total_views` is a real COUNT(*) over student_profile_views for this
        student. `recent_viewers` lists who looked, resolved to a display name
        BY ROLE (a student viewer from students.full_name, a company viewer from
        companies.legal_name, an admin viewer falls back to the role label). The
        viewer's email and phone are deliberately NOT exposed.

        Existing rows are unique per viewer through the composite primary key
        (student_id, viewer_id), and viewed_at means "first seen" rather than
        "last seen".

        The endpoint reports existing rows only; it does not create new views.
        By default, `recent_viewers` returns the six most recent viewers;
        `total_views` remains the full count and is not limited by that cap.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many recent viewers to return. 1-100, default 6.
          schema: { type: integer, minimum: 1, maximum: 100, default: 6 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /students/me/profile-image:
    post:
      tags: [Students]
      summary: Upload or replace the student's own profile image
      description: >-
        multipart/form-data, field `image` (also accepted: `file`,
        `profile_image`). Allowed extensions jpg/jpeg/png/webp, maximum 5MB
        (PROFILE_IMAGE_MAX_SIZE, applied before the file reaches the shared
        upload service so a rejection is a real 422 rather than the generic
        upload failure). The MIME type is
        sniffed from the file's own bytes with finfo and must agree with the
        extension, and the leading magic bytes must match too. Stored through
        the shared upload service with a randomized filename, then referenced by
        students.profile_image_file_id. A previous image is not deleted; the
        reference is simply replaced. If the file cannot be attached the newly
        uploaded file is discarded, so a failed upload never leaves an orphan
        row or an unreferenced file on disk. The returned `profile_image_url` is
        a short-lived signed URL (about one hour) that a browser <img> tag can
        load without an Authorization header; the signed route only serves files
        typed profile_image, never CVs or academic certificates.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Students]
      summary: Detach the student's profile image
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /students/me/education:
    get:
      tags: [Students]
      summary: List the authenticated student's education records
      description: >-
        Every read and write is scoped to the authenticated student, so an id
        belonging to another student is reported as 404 rather than acted on.
        Records are ordered end_year DESC then id DESC, so the most recent
        qualification comes first and an ongoing one sorts to the top.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Students]
      summary: Add an education record
      description: >-
        Requires a degree or a university. `degree_name` is the education degree
        lookup ID (integer) and is resolved through the degrees lookup; a value
        that does not resolve is a 422 rather than a silent fallback. `university_name`
        and `field_study` are free-text fields. A faculty must belong to the
        record's university and a specialization to its field of study.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                degree_id: { type: integer, format: int64 }
                degree_name: { type: integer, format: int64, description: Education degree lookup ID. Integer IDs are accepted; free-text degree names are rejected. }
                university_id: { type: integer, format: int64 }
                university_name: { type: string, maxLength: 255 }
                faculty_id: { type: integer, format: int64 }
                field_id: { type: integer, format: int64 }
                field_study: { type: string, maxLength: 255 }
                specialization_id: { type: integer, format: int64 }
                study_mode: { type: string, enum: [onsite, online, hybrid] }
                start_year: { type: integer }
                end_year: { type: integer }
                grade: { type: string, maxLength: 100 }
                is_current: { type: boolean }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /students/me/education/{id}:
    put:
      tags: [Students]
      summary: Update one of the authenticated student's education records
      description: >-
        Partial: untouched fields keep their stored value, and the year-order
        rules are evaluated against the record's final merged state rather than
        against a half-filled payload. `is_current` cannot have an end year.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                degree_id: { type: integer, format: int64 }
                degree_name: { type: integer, format: int64, description: Education degree lookup ID. Integer IDs are accepted; free-text degree names are rejected. }
                university_id: { type: integer, format: int64 }
                university_name: { type: string, maxLength: 255 }
                faculty_id: { type: integer, format: int64 }
                field_id: { type: integer, format: int64 }
                field_study: { type: string, maxLength: 255 }
                specialization_id: { type: integer, format: int64 }
                study_mode: { type: string, enum: [onsite, online, hybrid] }
                start_year: { type: integer }
                end_year: { type: integer }
                grade: { type: string, maxLength: 100 }
                is_current: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Students]
      summary: Delete one of the authenticated student's education records
