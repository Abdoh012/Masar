components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh-token cookie
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for cookie-based state-changing requests (e.g. refresh via cookie)

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:
    StudentHeader:
      type: object
      description: >-
        The complete GET /students/me header contract. Exactly these thirteen
        fields, no more.
      required:
        - id
        - academic_status
        - is_profile_complete
        - updated_at
        - bio
        - field
        - profile_image_url
        - profile_image_file_id
        - full_name
        - specialization
        - university
        - faculty
        - member_since
      additionalProperties: false
      properties:
        id: { type: integer, example: 1498 }
        academic_status: { type: string, nullable: true, example: student }
        is_profile_complete:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Completion PERCENTAGE (0-100) computed from field_id,
            specialization_id, at least one skill and an attached CV. The same
            canonical value GET /students/profile/status returns. This is NOT
            the stored students.is_profile_complete boolean column.
          example: 50
        updated_at: { type: string, nullable: true, example: '2026-10-01 02:48:57' }
        bio: { type: string, nullable: true }
        field:
          type: string
          nullable: true
          description: study_fields.name behind students.field_id; null when unset.
          example: Engineering
        profile_image_url:
          type: string
          nullable: true
          description: Public API download URL; the filesystem path is never exposed.
          example: 'http://localhost/Masar/backend/api/v1/files/544?download=true'
        profile_image_file_id: { type: integer, nullable: true, example: 544 }
        full_name: { type: string, nullable: true, example: Mohamed Ahmed }
        specialization: { type: string, nullable: true, example: Backend Development }
        university: { type: string, nullable: true }
        faculty: { type: string, nullable: true }
        member_since:
          type: string
          nullable: true
          description: users.created_at formatted as ISO-8601 with a timezone offset.
          example: '2026-09-02T05:23:43+03:00'
    StudentMeData:
      type: object
      required: [header]
      additionalProperties: false
      properties:
        header: { $ref: '#/components/schemas/StudentHeader' }
    StudentContactData:
      type: object
      required: [email, phone, website, external_profile, address]
      additionalProperties: false
      properties:
        email: { type: string, format: email, example: student@example.com }
        phone: { type: string, nullable: true, maxLength: 50, example: '01112345682' }
        website: { type: string, format: uri, nullable: true, maxLength: 255, example: 'https://student.example.com' }
        external_profile: { type: string, format: uri, nullable: true, maxLength: 255, example: 'https://www.linkedin.com/in/student' }
        address: { type: string, nullable: true, maxLength: 500, example: 'New Cairo, Cairo' }
    ApplicationStatusSummary:
      type: object
      description: >-
        The student's total number of applications per lifecycle status across
        all pages (not just the current page). The same summary is returned by
        all four tab endpoints and only counts the authenticated student's own
        applications.
      required: [applied_count, accepted_count, rejected_count, withdrawn_count]
      additionalProperties: false
      properties:
        applied_count:
          type: integer
          minimum: 0
          description: Applications whose DB status is submitted (displayed as Applied).
          example: 4
        accepted_count: { type: integer, minimum: 0, example: 2 }
        rejected_count: { type: integer, minimum: 0, example: 1 }
        withdrawn_count: { type: integer, minimum: 0, example: 3 }
    StudentApplicationListData:
      type: object
      required: [summary, items, pagination]
      properties:
        summary: { $ref: '#/components/schemas/ApplicationStatusSummary' }
        items:
          type: array
          description: >-
            The tab's card DTO items. The item shape depends on the endpoint
            (Applied, Accepted, Rejected or Withdrawn card DTO).
          items: { type: object }
        pagination:
          type: object
          required: [current_page, per_page, total, total_pages, has_next_page, has_previous_page]
          properties:
            current_page: { type: integer, minimum: 1, example: 1 }
            per_page: { type: integer, minimum: 1, example: 20 }
            total: { type: integer, minimum: 0, example: 4 }
            total_pages: { type: integer, minimum: 0, example: 1 }
            has_next_page: { type: boolean, example: false }
            has_previous_page: { type: boolean, example: false }
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, nullable: true }
        data: { type: object, nullable: true }
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors: { type: object, nullable: true }
    ValidationErrors:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Validation failed. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, super_admin, student, company, trainer, moderator, employee] }
        status: { type: string, enum: [active, inactive, suspended, pending] }
    RegisterRequest:
      type: object
      required: [full_name, email, password, password_confirmation, accept_terms, role]
      properties:
        full_name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }
        accept_terms: { type: boolean }
        role: { type: string, enum: [student, company] }
        field: { type: string, description: Required for students; must match seeded lookup }
        specialization: { type: string, description: Required for students; must match seeded lookup }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        remember: { type: boolean, description: When true, also sets the remember-me cookie. }
    AuthTokenData:
      type: object
      description: Authentication payload returned by login and similar flows.
      properties:
        user: { $ref: '#/components/schemas/User' }
        token:
          type: string
          description: JWT access token.
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds (from JWT_ACCESS_TTL).
          example: 3600
        refresh_token:
          type: string
          description: Rotatable refresh token (also delivered as HttpOnly cookie).
        refresh_expires_in:
          type: integer
          description: Refresh token lifetime in seconds (from JWT_REFRESH_TTL).
          example: 2592000
    AuthRefreshData:
      type: object
      description: Payload returned by POST /auth/refresh after successful rotation.
      properties:
        user: { $ref: '#/components/schemas/User' }
        token:
          type: string
          description: New JWT access token.
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 3600
        refresh_token:
          type: string
          description: New refresh token (rotated; previous token is revoked).
        refresh_expires_in:
          type: integer
          description: Refresh token lifetime in seconds.
          example: 2592000
    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Refresh token (used when not relying on the HttpOnly cookie).
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          format: password
          description: The account's current password. Must verify, otherwise the change is refused with 400.
        new_password:
          type: string
          format: password
          minLength: 12
          description: >-
            The new password. Policy (enforced by security_password_strength_errors(),
            the single source of truth shared with register and reset-password):
            at least 12 characters, with at least one lowercase letter, one
            uppercase letter, one digit and one special character. Must differ
            from the current password.
        new_password_confirmation:
          type: string
          format: password
          description: Must equal new_password exactly.
      description: >-
        Body of POST /auth/change-password. The field names are
        current_password / new_password / new_password_confirmation.

        On success the account's password_hash is rewritten and every row in
        `auth_tokens` and `refresh_tokens` for that user is revoked, the current
        device's access token is blacklisted, and the remember-me and refresh
        cookies are cleared.

        SESSION BEHAVIOUR: access tokens are stateless JWTs and are not
        persisted when issued, so other devices are NOT signed out immediately.
        An outstanding access token on another device remains valid until it
        expires on its own (JWT_ACCESS_TTL, default 3600 seconds = 1 hour) and
        then fails to refresh. See docs/api/authentication.md.

        No application, training, payment or certificate record is read or
        written by this endpoint.
    CertificateStatistics:
      type: object
      required: [total, eligible, pending, issued, revoked]
      properties:
        total:
          type: integer
          description: Persisted certificate records in scope. Never includes eligible.
          example: 14
        eligible:
          type: integer
          description: Students eligible to request a certificate. Not a persisted status.
          example: 8
        pending:
          type: integer
          description: Persisted certificate requests awaiting review.
          example: 5
        issued:
          type: integer
          description: Certificates currently issued and not revoked.
          example: 6
        revoked:
          type: integer
          description: Certificates that have been revoked.
          example: 3
    MessagingConversation:
      type: object
      description: >-
        A conversation row. The participants are always the student and the
        company of one training application; there is no title column and no
        arbitrary participant list.
      required: [id, student_id, company_id, application_id, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, example: 225 }
        student_id: { type: integer, format: int64, example: 1458 }
        company_id: { type: integer, format: int64, example: 100144 }
        application_id: { type: integer, format: int64, example: 1671 }
        created_at: { type: string, example: '2026-08-01 11:30:00' }
        updated_at: { type: string, example: '2026-08-13 10:00:00' }
        student_name: { type: string, nullable: true }
        company_name: { type: string, nullable: true }
        company_image:
          type: string
          nullable: true
          description: >-
            The conversation's company's profile image as the relative storage
            path stored in companies.company_logo (e.g.
            companies/20260821_a1b2c3d4.png), or null when the company has no
            logo. Only present on the conversations list endpoint.
          example: companies/20260821_a1b2c3d4.png
        training_title: { type: string, nullable: true }
        unread_count:
          type: integer
          minimum: 0
          description: >-
            Messages from the other participant that are not read yet. Only
            present on the list endpoint.
          example: 1
        last_message:
          allOf:
            - $ref: '#/components/schemas/MessagingLastMessage'
          nullable: true
          description: >-
            The conversation's latest message, or null when the conversation
            has no messages. Only present on the list endpoint.
        application_status:
          type: string
          nullable: true
          description: >-
            Status of the linked training application, read live from the
            database (e.g. accepted, submitted, rejected, withdrawn). Only
            present on the list endpoint.
          example: accepted
        training:
          allOf:
            - $ref: '#/components/schemas/MessagingTraining'
          nullable: true
          description: >-
            The linked training listing (title, starts_at, ends_at), or null
            when no training listing is linked. Dates are null when the
            listing has none. Only present on the list endpoint.
    MessagingLastMessage:
      type: object
      description: >-
        A conversation's latest message preview. The latest message is the
        newest by created_at then id; `body` is the full message body.
      required: [id, body, sender_user_id, created_at]
      properties:
        id: { type: integer, format: int64, example: 1108 }
        body: { type: string, maxLength: 5000, example: 'Just bring your laptop and any portfolio pieces you mentioned.' }
        sender_user_id: { type: integer, format: int64, example: 100568 }
        created_at: { type: string, example: '2026-08-17 11:00:00' }
    MessagingTraining:
      type: object
      description: >-
        A linked training listing, using the actual `training_listings`
        columns. Dates are returned as stored and are null when the listing
        has none.
      required: [title]
      properties:
        title: { type: string, example: 'Junior PHP Developer Track' }
        starts_at:
          type: string
          nullable: true
          example: '2026-08-10 09:00:00'
        ends_at:
          type: string
          nullable: true
          example: '2026-08-27 17:00:00'
    MessagingConversationListData:
      type: object
      description: >-
        The page of conversation rows plus pagination metadata. `total` is
        scoped to the authenticated user with the same visibility and filters
        as the list query; it does not change with `limit` or `offset`.
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MessagingConversation' }
        pagination:
          type: object
          required: [total, limit, offset]
          properties:
            total: { type: integer, minimum: 0, example: 3 }
            limit: { type: integer, minimum: 1, maximum: 100, example: 20 }
            offset: { type: integer, minimum: 0, example: 0 }
    MessagingConversationHeader:
      type: object
      description: >-
        The conversation's header, returned once at the top level of the
        messages list (not inside message objects).
      required: [id, company]
      properties:
        id: { type: integer, format: int64, example: 262 }
        company:
          type: object
          nullable: true
          required: [id, name, image]
          properties:
            id: { type: integer, format: int64, example: 100161 }
            name: { type: string, example: 'TestHire Solutions' }
            image:
              type: string
              nullable: true
              description: >-
                The company's profile image as the relative storage path
                stored in companies.company_logo (e.g.
                company-logo-test/data.png), or null when the company has no
                logo. Only present on the messages list endpoint.
              example: company-logo-test/data.png
    MessagingMessage:
      type: object
      description: A stored message. `sender_id` is an alias of `sender_user_id`.
      required: [id, conversation_id, sender_user_id, body, is_read, created_at]
      properties:
        id: { type: integer, format: int64, example: 1104 }
        conversation_id: { type: integer, format: int64, example: 225 }
        sender_user_id: { type: integer, format: int64, example: 100568 }
        body: { type: string, maxLength: 5000 }
        is_read: { type: integer, enum: [0, 1], example: 1 }
        is_edited:
          type: integer
          enum: [0, 1]
          default: 0
          description: >-
            1 when the message was edited at least once. Set to 1 by the edit
            endpoint; always 0 for messages that were never edited.
          example: 0
        read_at: { type: string, nullable: true, example: '2026-08-14 12:00:00' }
        created_at: { type: string, example: '2026-08-13 11:00:00' }
        updated_at:
          type: string
          nullable: true
          description: >-
            Timestamp of the most recent edit. Null when the message has never
            been edited. `id` and `created_at` never change on edit.
          example: '2026-11-20 21:00:00'
        sender_id: { type: integer, format: int64, example: 100568 }
    MessagingMessagePagination:
      type: object
      description: >-
        Cursor metadata returned beside the flat `data` array on the messages
        list endpoint. `has_more` is computed with a limit + 1 read; the extra
        row is never returned. Cursors are null for an empty page.
      required: [limit, has_more, next_before_id, next_after_id]
      properties:
        limit: { type: integer, minimum: 1, maximum: 20, example: 12 }
        has_more: { type: boolean, example: true }
        next_before_id:
          type: integer
          format: int64
          nullable: true
          description: Oldest id in the page; pass as before_id for older messages.
          example: 1104
        next_after_id:
          type: integer
          format: int64
          nullable: true
          description: Newest id in the page; pass as after_id for newer messages.
          example: 1108
    MessagingConversationCreateRequest:
      type: object
      required: [application_id]
      additionalProperties: true
      properties:
        application_id:
          type: integer
          format: int64
          minimum: 1
          description: The accepted training application to open a conversation for.
          example: 2009
      description: >-
        Only `application_id` is used. `title`, `name`, `participant_id`,
        `participant_ids` and `participants` are rejected with 422 because the
        conversations table cannot persist them.
    MessagingMessageCreateRequest:
      type: object
      required: [body]
      additionalProperties: true
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
          description: >-
            Message text. Trimmed before validation; must be non-empty and valid
            UTF-8. `message` and `content` are accepted aliases.
          example: Hello, thank you for accepting my application.
        conversation_id:
          type: integer
          format: int64
          description: >-
            Optional. The URL id is authoritative; a differing value is a 422.
      description: >-
        `sender_user_id`, `sender_id` and `user_id` are ignored when they equal
        the authenticated user and rejected with 422 when they differ.
        `message_type`, `reply_to_id`, `attachment_ids`, `attachments` and
        `file_id` are rejected with 422 because they are not persisted.
    MessagingMessageUpdateRequest:
      type: object
      required: [body]
      additionalProperties: true
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
          description: >-
            Message text. Trimmed before validation; must be non-empty and
            valid UTF-8. `message` and `content` are accepted aliases.
      description: >-
        Only the message `body` is updatable. Sender identity fields are never
        accepted as authority: they are ignored when equal to the
        authenticated user and rejected with 422 otherwise.

  responses:
    Success:
      description: Successful operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    StudentMeSuccess:
      description: >-
        The authenticated student's self header. `data` contains `header` and
        nothing else.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/StudentMeData' }
    StudentContactSuccess:
      description: >-
        The authenticated student's five-field contact details. Unset optional
        fields are null, and no other contact field is returned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/StudentContactData' }
    StudentApplicationListSuccess:
      description: >-
        The authenticated student's applications for the tab plus a `summary`
        object with the total count per status across all pages.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/StudentApplicationListData' }
    CertificateStatisticsSuccess:
      description: Certificate statistics for the authenticated user's scope
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/CertificateStatistics' }
    AuthSuccess:
      description: >-
        Authenticated successfully. Returns an access token and the authenticated
        user; a refresh token and CSRF cookie are also set (HttpOnly refresh
        cookie + readable CSRF cookie) and the refresh token/expiry are included
        in the response body for clients that do not rely on cookies.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthTokenData' }
    AuthTokenRefreshSuccess:
      description: >-
        Refresh succeeded. The previous refresh token is revoked and rotated; a
        new access token and a new refresh token are returned and the refresh
        cookie is updated.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthRefreshData' }
    NoContent:
      description: No content
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrors' }
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Error:
      description: The request could not be processed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

x-websocket:
  summary: Real-time messaging events (not an HTTP path)
  description: >-
    OpenAPI 3.0 has no native WebSocket path type. This extension documents the
    separate, real RFC 6455 server. The HTTP API remains the source of truth for
    message persistence; the socket only delivers events for messages that have
    already been committed.
  entryPoint: websocket/server.php
  startup: php websocket/server.php
  connectionUrl: 'ws://127.0.0.1:8081/?token=ACCESS_TOKEN'
  transport: RFC 6455 over TCP, PHP core streams (no ext-sockets/pcntl required)
  authentication:
    description: >-
      The existing JWT access token is required. It is accepted as an
      `Authorization: Bearer ACCESS_TOKEN` handshake header or as the `token`
      query parameter for browser clients. Signature, expiry, token type and
      active user status are validated against the same configuration and
      database as the HTTP API. Tokens are never logged.
    handshakeErrors:
      '400': Invalid or missing WebSocket upgrade headers
      '401': Missing, invalid, expired token or inactive user
      '429': Too many connection attempts from this IP
      '503': Server connection limit reached
  configuration:
    - { name: WS_HOST, default: '127.0.0.1' }
    - { name: WS_PORT, default: 8081 }
    - { name: WS_MAX_CONNECTIONS, default: 100 }
    - { name: WS_PING_INTERVAL, default: 30 }
    - { name: WS_OUTBOX_INTERVAL_MS, default: 500 }
    - { name: WS_OUTBOX_BATCH, default: 50 }
  clientMessages:
    - type: subscribe
      payload: { type: subscribe, conversation_id: 225 }
      ack: { type: subscribed, data: { conversation_id: 225, baseline_message_id: 1108 } }
      errors: [validation_error, unauthorized, forbidden, not_found]
      description: >-
        Membership is re-checked against the database on every subscription.
        A baseline message id is captured so history is never replayed.
    - type: unsubscribe
      payload: { type: unsubscribe, conversation_id: 225 }
      ack: { type: unsubscribed, data: { conversation_id: 225 } }
    - type: ping
      payload: { type: ping }
      ack: { type: pong, data: {} }
  serverEvents:
    - type: message.created
      description: >-
        Delivered only to authenticated subscribers of the conversation, for
        messages created after their subscription baseline.
      payload:
        type: message.created
        data:
          event_id: 42
          conversation_id: 225
          message_id: 1234
          sender_user_id: 100532
          body: Hello!
          created_at: '2026-11-20 10:15:00'
  reliability:
    - >-
      A `message_events` outbox row is inserted in the same transaction as the
      message, so events are never broadcast before commit or for failed writes.
    - >-
      Pending events left during downtime are discarded at startup; clients use
      `GET /conversations/{id}/messages?after_id=<last_seen_id>` to recover.
    - Server ping/pong detects dead peers; missed pongs close the connection.
  restrictions:
    - >-
      Chat messages cannot be sent over the socket. All business rules,
      including the withdrawn-application send block, are enforced by the HTTP
      API only.
    - No email, token, password or internal database detail is present in events.
